<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrigoSIMU</title>
<meta name="description" content="Simulador de esquemas eléctricos (estilo CADe SIMU) con el circuito frigorífico animado: presiones, temperaturas y flujo en cada línea.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23ad5724'/%3E%3Cpath d='M12 3.5v17M4.6 7.75l14.8 8.5M4.6 16.25l14.8-8.5' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* FrigoSIMU — estilos */

:root {
  --paper: #edf1f4;
  --panel: #ffffff;
  --panel-2: #f5f7f9;
  --line: #d5dde4;
  --line-strong: #b3c0cb;
  --ink: #15212c;
  --ink-2: #394856;
  --muted: #647585;
  --accent: #ad5724;
  --accent-ink: #ffffff;
  --accent-soft: #f5e5da;
  --focus: #1f6fd1;
  --canvas: #fbfcfd;
  --grid: #cfd8e0;
  --sym: #1d2833;
  --sym-bg: #fbfcfd;
  --select: #1f6fd1;
  --live: #d4332a;
  --neutral: #1f62c6;
  --short: #e2940b;
  --hp-gas: #d4332a;
  --hp-liq: #e0701f;
  --lp-mix: #3ba4dc;
  --lp-gas: #2157c2;
  --ok: #1c8a4d;
  --warn: #c48507;
  --bad: #cc372c;
  --room: #e6f0f7;
  --room-line: #9fbfd5;
  --unit: #f2f4f6;
  --unit-line: #b8c4ce;
  --shell: #8a5a36;
  --ice: #ffffff;
  --housing: #dde5ec;
  --glow: 0.55;
  --shadow: 0 1px 2px rgba(21, 33, 44, 0.08), 0 6px 20px rgba(21, 33, 44, 0.08);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --dock-h: 250px;
  --split: 0.54;
  --pal-w: 188px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0c1116;
    --panel: #131a22;
    --panel-2: #18212b;
    --line: #25313d;
    --line-strong: #354453;
    --ink: #e4ebf1;
    --ink-2: #b6c3cf;
    --muted: #8394a4;
    --accent: #e38a51;
    --accent-ink: #1c0e05;
    --accent-soft: #3a2517;
    --focus: #5aa2ff;
    --canvas: #0e141a;
    --grid: #223040;
    --sym: #d3dce6;
    --sym-bg: #0e141a;
    --select: #5aa2ff;
    --live: #ff5b50;
    --neutral: #5c9cff;
    --short: #ffb020;
    --hp-gas: #ff5a4e;
    --hp-liq: #ff9142;
    --lp-mix: #5cc5f5;
    --lp-gas: #4f88ff;
    --ok: #3cbc75;
    --warn: #e6a82c;
    --bad: #ff5d52;
    --room: #11202c;
    --room-line: #2d4b61;
    --unit: #141b22;
    --unit-line: #33414e;
    --shell: #6e4a30;
    --ice: #e8f4ff;
    --housing: #1c2833;
    --glow: 0.8;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.35);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0c1116;
  --panel: #131a22;
  --panel-2: #18212b;
  --line: #25313d;
  --line-strong: #354453;
  --ink: #e4ebf1;
  --ink-2: #b6c3cf;
  --muted: #8394a4;
  --accent: #e38a51;
  --accent-ink: #1c0e05;
  --accent-soft: #3a2517;
  --focus: #5aa2ff;
  --canvas: #0e141a;
  --grid: #223040;
  --sym: #d3dce6;
  --sym-bg: #0e141a;
  --select: #5aa2ff;
  --live: #ff5b50;
  --neutral: #5c9cff;
  --short: #ffb020;
  --hp-gas: #ff5a4e;
  --hp-liq: #ff9142;
  --lp-mix: #5cc5f5;
  --lp-gas: #4f88ff;
  --ok: #3cbc75;
  --warn: #e6a82c;
  --bad: #ff5d52;
  --room: #11202c;
  --room-line: #2d4b61;
  --unit: #141b22;
  --unit-line: #33414e;
  --shell: #6e4a30;
  --ice: #e8f4ff;
  --housing: #1c2833;
  --glow: 0.8;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, select, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------------------------------------------------------------- layout */
.app {
  height: 100%;
  display: grid;
  grid-template-columns: var(--pal-w) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) var(--dock-h);
  grid-template-areas: "top top" "pal stage" "dock dock";
}
.app.sim-mode { --pal-w: 0px; }
.app.sim-mode .palette { display: none; }
.app.dock-collapsed { --dock-h: 38px; }
.viewtabs { display: none; }

/* ---------------------------------------------------------------- topbar */
.topbar {
  grid-area: top;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  padding: 7px 14px;
  padding-top: calc(7px + env(safe-area-inset-top, 0px));
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 5;
}
.brand { display: flex; align-items: center; gap: 7px; margin-right: 4px; }
.brand-mark { width: 24px; height: 24px; color: var(--accent); }
.brand-name { font: 600 21px/1 var(--font-display); letter-spacing: 0.02em; }
.brand-name b { font-weight: 700; color: var(--accent); }
.tb-group { display: flex; align-items: center; gap: 4px; }
.tb-right { margin-left: auto; }
.tb-sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.btn:hover { background: var(--panel-2); border-color: var(--line-strong); color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.icon { padding: 0 7px; }
.btn.small { height: 28px; padding: 0 8px; font-size: 13px; }
.btn.small svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); color: var(--accent-ink); }
.btn.tool.on, .btn.toggle[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.danger { color: var(--bad); }
.app.sim-mode #btn-sim { background: var(--panel); color: var(--bad); border-color: var(--bad); }
.app.paused #btn-pause { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

.select-btn select, .speed select, .field select, .field input, .field textarea {
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
  padding: 0 8px;
}
.select-btn select { max-width: 250px; font-weight: 500; }
.sim-clock {
  font: 500 14px var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
  padding: 4px 8px;
  border-radius: 6px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  min-width: 78px;
  text-align: center;
}
.app:not(.sim-mode) .sim-only { display: none; }
.app:not(.sim-mode) .sim-clock { display: none; }
.tb-break { display: none; }
.app.sim-mode .edit-only { display: none !important; }

/* ---------------------------------------------------------------- palette */
.palette {
  grid-area: pal;
  overflow-y: auto;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 8px 8px 24px;
}
.pal-cat { margin-top: 10px; }
.pal-cat h3 {
  margin: 0 4px 6px;
  font: 600 12px var(--font-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
.pal-cat.fridge-cat h3 { color: var(--accent); }
.pal-items { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pal-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 5px 3px 6px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: none;
  cursor: pointer;
  color: var(--ink-2);
  font-size: 11px;
  line-height: 1.2;
  text-align: center;
}
.pal-item:hover { background: var(--panel-2); border-color: var(--line); }
.pal-item.on { background: var(--accent-soft); border-color: var(--accent); }
.pal-item svg { width: 52px; height: 40px; }
.pal-item span { overflow-wrap: anywhere; hyphens: auto; }

/* ---------------------------------------------------------------- stage */
.stage { grid-area: stage; display: flex; min-width: 0; min-height: 0; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--canvas); }
.pane-elec { flex: var(--split) 1 0; }
.pane-fridge { flex: calc(1 - var(--split)) 1 0; border-left: 1px solid var(--line); }
.app.no-fridge .pane-fridge, .app.no-fridge .splitter { display: none; }
.app.no-fridge .pane-elec { flex: 1 1 0; }
.pane-head {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 4px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.pane-head h2 { margin: 0; font: 600 16px var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.pane-spacer { flex: 1; }
.mode-chip {
  font: 600 11px var(--font-display);
  letter-spacing: 0.1em;
  padding: 2px 7px;
  border-radius: 4px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--muted);
}
.app.sim-mode .mode-chip { background: color-mix(in srgb, var(--ok) 14%, var(--panel)); border-color: var(--ok); color: var(--ok); }
.app.sim-mode.paused .mode-chip { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.canvas-wrap { position: relative; flex: 1; min-height: 0; }
.canvas-wrap > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.hint {
  min-height: 26px;
  padding: 4px 10px;
  font-size: 12px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  background: var(--panel);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.splitter { width: 6px; cursor: col-resize; background: var(--panel-2); border-left: 1px solid var(--line); flex: none; }
.splitter:hover, .splitter.dragging { background: var(--accent-soft); }
.banner {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  max-width: calc(100% - 24px);
  padding: 8px 14px;
  border-radius: 6px;
  background: var(--bad);
  color: #fff;
  font-weight: 600;
  box-shadow: var(--shadow);
}

.chips { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 7px;
  border-radius: 11px;
  font-size: 11.5px;
  color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.chip.on { color: var(--ink); border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.chip.on i { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.chip.warn.on { border-color: var(--warn); }
.chip.warn.on i { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 22%, transparent); }
.chip.bad.on { border-color: var(--bad); }
.chip.bad.on i { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 22%, transparent); }
.chip.absent { opacity: 0.45; }

.toast {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 12px;
  max-width: 560px;
  padding: 9px 12px 9px 14px;
  border-radius: 6px;
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  box-shadow: var(--shadow);
  font-size: 13px;
  color: var(--ink);
  pointer-events: none;
  animation: toast-in 0.25s ease-out;
}
.toast.warn { border-left-color: var(--warn); }
.toast.error { border-left-color: var(--bad); }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }
.fridge-off {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 20px;
  background: color-mix(in srgb, var(--canvas) 86%, transparent);
  text-align: center;
  color: var(--muted);
}

/* ---------------------------------------------------------------- dock */
.dock {
  grid-area: dock;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border-top: 1px solid var(--line);
  position: relative;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.dock-resize { position: absolute; left: 0; right: 0; top: -4px; height: 8px; cursor: row-resize; z-index: 2; }
.tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px 8px 0;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
  flex: none;
}
.tabs [role="tab"] {
  height: 34px;
  padding: 0 12px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--muted);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.tabs [role="tab"]:hover { color: var(--ink); }
.tabs [role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.app.dock-collapsed #btn-dock svg { transform: rotate(180deg); }
.badge {
  display: inline-block;
  min-width: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--accent);
  color: var(--accent-ink);
  font-size: 11px;
  line-height: 18px;
  text-align: center;
}
.panels { flex: 1; min-height: 0; position: relative; }
.panel { position: absolute; inset: 0; overflow: auto; padding: 12px 16px 16px; }
.chart-panel { display: flex; flex-direction: column; padding: 6px 12px 8px; }
.chart-panel canvas { flex: 1; min-height: 0; width: 100%; display: block; }
.chart-tools, .log-tools { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding-bottom: 4px; flex-wrap: wrap; }
.log-tools { justify-content: space-between; }
.chart-legend { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.chart-legend i { display: inline-block; width: 12px; height: 4px; border-radius: 2px; margin-left: 8px; }
.lg-run { background: var(--ok); }
.lg-heat { background: var(--warn); }
.lg-door { background: var(--muted); }
.seg { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
.seg.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }

/* Propiedades / formularios */
.props-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px 16px; align-items: start; }
.props-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.props-head h3 { margin: 0; font: 600 20px var(--font-display); letter-spacing: 0.02em; }
.props-head .kind { color: var(--muted); font-size: 13px; }
.props-actions { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.field input[type="text"], .field input[type="number"], .field select, .field textarea { width: 100%; font-size: 14px; color: var(--ink); }
.field textarea { height: auto; min-height: 64px; padding: 6px 8px; resize: vertical; line-height: 1.4; }
.field.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.field .hint2 { font-size: 11px; color: var(--muted); }
.field input[type="range"] { width: 100%; accent-color: var(--accent); }
.field .rangeval { font: 500 12px var(--font-mono); color: var(--ink-2); }
.live-box {
  margin-top: 12px;
  padding: 8px 12px;
  border-radius: 6px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  font-size: 13px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.help { max-width: 72ch; color: var(--ink-2); }
.help h3 { margin: 0 0 6px; font: 600 20px var(--font-display); }
.help p { margin: 0 0 8px; }
.help kbd { font: 500 11px var(--font-mono); padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--panel-2); }
.help ul { margin: 0 0 8px; padding-left: 18px; }

.room-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 24px; align-items: start; }
.room-cols h4 { margin: 0 0 8px; font: 600 13px var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn.door-btn { height: 38px; font-weight: 600; }
.btn.door-btn.open { background: color-mix(in srgb, var(--warn) 18%, var(--panel)); border-color: var(--warn); color: var(--ink); }
.note { font-size: 12px; color: var(--muted); margin: 0; }

/* Diagnóstico */
.diag { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px 24px; align-items: start; }
.diag table { width: 100%; border-collapse: collapse; font-size: 13px; }
.diag td { padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.diag td.v { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.diag td.sub { color: var(--muted); font-size: 12px; }
.pill { display: inline-block; min-width: 46px; padding: 1px 6px; border-radius: 9px; font-size: 11px; font-weight: 600; text-align: center; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.high, .pill.low { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.na, .pill.info { background: var(--panel-2); color: var(--muted); }
.findings { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.findings li { padding: 8px 10px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); font-size: 13px; }
.diag h4 { margin: 0 0 8px; font: 600 13px var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* Aviso flotante */
.snack {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: calc(100vw - 32px);
  padding: 9px 12px 9px 16px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--panel);
  box-shadow: var(--shadow);
  font-size: 13px;
  animation: toast-in 0.2s ease-out;
}

/* Registro */
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 13px; }

.defrost-fill { fill: color-mix(in srgb, var(--warn) 24%, var(--sym-bg)); }

.lamp-off-amarillo { fill: color-mix(in srgb, #f5b700 14%, var(--sym-bg)); }
.lamp-off-blanco { fill: var(--sym-bg); }
.lamp-off-azul { fill: color-mix(in srgb, #3b82f6 12%, var(--sym-bg)); }

.lamp-on.lamp-rojo { fill: #ff4b3e; filter: drop-shadow(0 0 6px rgba(255, 75, 62, var(--glow))); }

.lamp-on.lamp-azul { fill: #4b8dff; filter: drop-shadow(0 0 6px rgba(75, 141, 255, var(--glow))); }

.wire { fill: none; stroke: var(--sym); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }

.wire.neutral { stroke: var(--neutral); stroke-width: 2.3; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes hum { 50% { transform: translateX(0.6px); } }
@keyframes blink { 50% { opacity: 0.35; } }

/* ---------------------------------------------------- circuito frigorífico */
svg.fridge { background: var(--canvas); }
.zone-room { fill: var(--room); stroke: var(--room-line); stroke-width: 1.5; }

.pipe { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; transition: opacity 0.4s; }
.pipe.thin { stroke-width: 5; }
.pipe-shell { fill: none; stroke: var(--shell); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: 0.35; }

.pipe.hpg { stroke: var(--hp-gas); }
.pipe.hpl { stroke: var(--hp-liq); }

.pipe.lpg { stroke: var(--lp-gas); }

.st-hpl { stop-color: var(--hp-liq); }

.st-lpg { stop-color: var(--lp-gas); }

.pipe.frosted { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 2px #cfe8ff); }
.flow { fill: none; stroke: rgba(255, 255, 255, 0.9); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 2 14; opacity: 0; transition: opacity 0.5s; }
.flow.thin { stroke-width: 2; stroke-dasharray: 2 12; }
.housing { fill: var(--housing); stroke: var(--line-strong); stroke-width: 1.2; }
.fins line { stroke: var(--line-strong); stroke-width: 0.8; opacity: 0.7; }
.fan-ring { fill: none; stroke: var(--line-strong); stroke-width: 2; }

.blades.on { animation: spin 0.5s linear infinite; }
.blades.on ellipse { fill: color-mix(in srgb, var(--ink-2) 35%, transparent); }
.hub { fill: var(--ink-2); }
.heater path { fill: none; stroke: color-mix(in srgb, var(--muted) 60%, transparent); stroke-width: 1.4; stroke-linejoin: round; }

.ice { fill: var(--ice); opacity: 0; pointer-events: none; }

.hatch { stroke: color-mix(in srgb, var(--lp-mix) 60%, #fff); stroke-width: 1.4; }
.dirt { fill: #8b6a3e; opacity: 0; pointer-events: none; }
.air path { fill: none; stroke: var(--lp-mix); stroke-width: 2; stroke-dasharray: 5 7; opacity: 0; transition: opacity 0.4s; }
.air.on path { opacity: 0.7; animation: airflow 0.9s linear infinite; }
.air.hot path { stroke: var(--hp-liq); }
.door-air path { fill: none; stroke: var(--hp-liq); stroke-width: 2.2; stroke-dasharray: 5 6; opacity: 0; }
.door-air path.cold { stroke: var(--lp-mix); }
.door-air.on path { opacity: 0.85; animation: airflow 0.8s linear infinite; }
@keyframes airflow { to { stroke-dashoffset: -24; } }
.door { cursor: pointer; }
.door-hit { fill: transparent; }
.door rect:not(.door-hit) { fill: color-mix(in srgb, var(--ink-2) 30%, var(--room)); stroke: var(--ink-2); stroke-width: 1.2; }
.door:hover rect:not(.door-hit) { stroke: var(--accent); }
.door:focus-visible { outline: none; }
.door:focus-visible rect:not(.door-hit) { stroke: var(--focus); stroke-width: 2; }
.door.open rect:not(.door-hit) { fill: color-mix(in srgb, var(--warn) 30%, var(--room)); }
.knob { fill: var(--ink-2); }
.door-gap { stroke: var(--room); stroke-width: 4; }
.valve path { fill: var(--sym-bg); stroke: var(--sym); stroke-width: 1.4; stroke-linejoin: round; }
.valve rect { fill: var(--housing); stroke: var(--sym); stroke-width: 1.2; }
.thinline { stroke: var(--sym); stroke-width: 1.2; }
.capillary { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 2; }
.bulb { fill: var(--housing); stroke: var(--sym); stroke-width: 1.2; }
.receiver { fill: var(--housing); stroke: var(--sym); stroke-width: 1.4; }
.recv-liq { fill: var(--hp-liq); opacity: 0.8; transition: y 0.4s, height 0.4s; }
.filter { fill: color-mix(in srgb, var(--shell) 45%, var(--housing)); stroke: var(--sym); stroke-width: 1.2; }
.glass-ring { fill: var(--housing); stroke: var(--sym); stroke-width: 1.3; }
.glass { fill: color-mix(in srgb, var(--hp-liq) 70%, #fff); transition: fill 0.3s; }
.glass.empty { fill: color-mix(in srgb, var(--hp-liq) 25%, #fff); }
.bubbles circle { fill: #fff; stroke: color-mix(in srgb, var(--hp-liq) 60%, #000); stroke-width: 0.5; opacity: 0; }
.bubbles.on circle { opacity: 1; animation: bubble 0.7s linear infinite; }
.bubbles.on circle:nth-child(2) { animation-delay: -0.2s; }
.bubbles.on circle:nth-child(3) { animation-delay: -0.45s; }
.bubbles.on circle:nth-child(4) { animation-delay: -0.6s; }

.sol-body { fill: var(--sym-bg); stroke: var(--sym); stroke-width: 1.3; stroke-linejoin: round; }

.compressor { fill: color-mix(in srgb, var(--shell) 25%, var(--housing)); stroke: var(--sym); stroke-width: 1.5; }
.compressor.on { fill: color-mix(in srgb, var(--ok) 18%, var(--housing)); animation: vibrate 0.09s linear infinite; }

.hose.hp { stroke: var(--hp-gas); }

.gauge.hp .g-rim { stroke: var(--hp-gas); }
.tk { stroke: var(--ink-2); stroke-width: 1.3; }

.tks { font: 500 6.8px var(--font-mono); fill: var(--accent); }
.g-name { font: 600 11px var(--font-display); letter-spacing: 0.12em; fill: var(--ink); }
.g-ref { font: 400 7.5px var(--font-ui); fill: var(--muted); }
.needle line { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.needle circle { fill: var(--ink); }
.gauge .needle { transition: transform 0.25s ease-out; }
.g-panel { fill: var(--panel-2); stroke: var(--line); }
.g-val { font: 600 13px var(--font-mono); fill: var(--ink); font-variant-numeric: tabular-nums; }

@media (prefers-reduced-motion: reduce) {
  .spin, .blades.on, .comp-spin.on, .compressor.on, .compressor.locked, .air.on path, .door-air.on path, .bubbles.on circle, .motor-hum, .wire.short { animation: none !important; }
}

/* ---------------------------------------------------------- pantallas pequeñas */

}

@media (max-width: 860px) {

  .tb-break { display: block; order: 3; flex-basis: 100%; height: 0; }
  .sim-group { order: 4; }

  .select-btn { flex: 1; min-width: 0; }

  .pane-elec, .pane-fridge, .app.no-fridge .pane-elec { flex: 1 1 0; }
  .pane-head { flex-wrap: wrap; row-gap: 4px; }
  .mode-chip { display: none; }
  .app:not(.sim-mode) .speed { display: none; }
  .toast { font-size: 12px; padding: 6px 10px; left: 8px; right: 8px; bottom: 8px; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) var(--dock-h); grid-template-areas: "top" "tabs" "stage" "dock"; }
  .app.dock-collapsed { --dock-h: 42px; }
  .palette {
    position: fixed;
    z-index: 20;
    left: 0;
    top: 0;
    bottom: 0;
    width: min(300px, 86vw);
    box-shadow: var(--shadow);
    transform: translateX(-105%);
    transition: transform 0.2s;
    grid-area: auto;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
  }
  .app.pal-open .palette { transform: none; }
  .viewtabs {
    grid-area: tabs;
    display: flex;
    gap: 4px;
    padding: 5px 10px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .viewtabs button { flex: 1; height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink-2); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
  .viewtabs button svg { width: 16px; height: 16px; }
  .viewtabs button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .splitter { display: none; }
  .app[data-view="elec"] .pane-fridge { display: none; }

  .pane-fridge { border-left: 0; }
  .brand-name { display: none; }
  .btn { height: 34px; }
  .tb-right { margin-left: 0; }
  .hint { display: none; }
  .pane-head h2 { font-size: 14px; }
  .diag { grid-template-columns: 1fr; }
}
</style>

<script>
(() => {
'use strict';
const __mods = {};
// ---- js/elec/components.js
__mods["js/elec/components.js"] = (() => {
// Biblioteca de componentes eléctricos (símbolos IEC, estilo CADe SIMU).
//
// Cada tipo define:
//   label, terms: [{n, x, y}] en unidades de rejilla (origen = primer borne),
//   box: [x0, y0, x1, y1] caja de selección (rejilla),
//   defaults: propiedades iniciales, props: campos editables,
//   links(ctx): pares de bornes conectados eléctricamente ahora mismo,
//   loads: cargas [{terms, kind}] (bobinas, lámparas, motores...),
//   draw(ctx): SVG en coordenadas locales (px),
//   master: tipo de dispositivo que crea (bobina de relé, temporizador...),
//   slaveOf: tipo de dispositivo del que depende (contactos por etiqueta).

const G = 20;

// ---------------------------------------------------------------- helpers SVG
const f = (n) => Math.round(n * 10) / 10;
const line = (x1, y1, x2, y2, cls = 's') => `<line class="${cls}" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"/>`;
const path = (d, cls = 's') => `<path class="${cls}" d="${d}"/>`;
const circle = (cx, cy, r, cls = 's') => `<circle class="${cls}" cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}"/>`;
const rect = (x, y, w, h, cls = 's') => `<rect class="${cls}" x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"/>`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/** Texto que se mantiene horizontal aunque el símbolo esté girado. */
function text(ctx, x, y, s, cls = 't', anchor = 'middle') {
  if (s === undefined || s === null || s === '') return '';
  const rot = ctx.comp.rot || 0;
  let a = anchor;
  // Al girar 180° el anclaje izquierdo/derecho se invierte visualmente.
  if (rot === 180 && anchor !== 'middle') a = anchor === 'end' ? 'start' : 'end';
  const tr = rot ? ` transform="rotate(${-rot} ${f(x)} ${f(y)})"` : '';
  return `<text class="${cls}" x="${f(x)}" y="${f(y)}" text-anchor="${a}" dominant-baseline="middle"${tr}>${esc(s)}</text>`;
}

function tagLabel(ctx, x = -16, y = 30) {
  const { props } = ctx.comp;
  let out = text(ctx, x, props.name ? y - 6 : y, props.tag, 'tag', 'end');
  if (props.name) out += text(ctx, x, y + 7, props.name, 'tname', 'end');
  return out;
}

const termNums = (ctx, a, b, x = 5) => text(ctx, x, 7, a, 'tn', 'start') + text(ctx, x, 54, b, 'tn', 'start');

// --------------------------------------------------------- piezas de símbolos
function contactNO(closed, cls = '', x = 0) {
  return (
    line(x, 0, x, 20) +
    line(x, 40, x, 60) +
    (closed ? line(x, 40, x - 1.5, 20, `s blade ${cls}`) : line(x, 40, x - 11, 21, `s blade ${cls}`))
  );
}

function contactNC(closed, cls = '', x = 0) {
  return (
    line(x, 0, x, 20) +
    line(x, 20, x - 12, 20) +
    line(x, 40, x, 60) +
    (closed ? line(x, 40, x - 13, 17, `s blade ${cls}`) : line(x, 40, x - 4, 22, `s blade ${cls}`))
  );
}

/** Conmutado: común arriba, NC recto hacia abajo, NA desplazado 2 cuadros. */
function changeover(actuated) {
  return (
    line(0, 0, 0, 18) +
    line(0, 44, 0, 60) +
    line(0, 44, -12, 44) +
    line(14, 44, 14, 50) +
    line(14, 50, 40, 50) +
    line(40, 50, 40, 60) +
    (actuated ? line(0, 18, 15, 42, 's blade') : line(0, 18, -11, 45, 's blade')) +
    circle(0, 18, 1.8, 'dot')
  );
}

function actuatorLine(x1, y, x2 = -26) {
  return line(x1, y, x2, y, 's dash');
}

const act = {
  push: (x = -26, y = 30) => path(`M${x + 4},${y - 6} H${x} V${y + 6} H${x + 4}`),
  pull: (x = -26, y = 30) => path(`M${x - 4},${y - 6} H${x} V${y + 6} H${x - 4}`),
  toggle: (x = -26, y = 30) => path(`M${x},${y - 6} V${y + 6} M${x},${y - 6} L${x - 5},${y - 11}`),
  estop: (x = -26, y = 30) => path(`M${x},${y} m0,-9 a9,9 0 0,0 0,18 z`, 's fillsym'),
  thermal: (x = -26, y = 30) => path(`M${x},${y - 5} h-5 v10 h-5`),
  position: (x = -26, y = 30) => path(`M${x},${y - 6} L${x - 7},${y} L${x},${y + 6}`),
  temp: (x = -26, y = 30) => rect(x - 14, y - 7, 14, 14) + `<text class="t sym-t" x="${x - 7}" y="${y + 0.5}" text-anchor="middle" dominant-baseline="middle">θ</text>`,
  press: (x = -26, y = 30) => rect(x - 14, y - 7, 14, 14) + `<text class="t sym-t" x="${x - 7}" y="${y + 0.5}" text-anchor="middle" dominant-baseline="middle">P</text>`,
  clock: (x = -26, y = 30) => circle(x - 7, y, 7) + path(`M${x - 7},${y} V${y - 5} M${x - 7},${y} H${x - 3}`),
  timer: (x = -26, y = 30, tof = false) =>
    tof ? path(`M${x + 2},${y - 6} a6,6 0 0,0 0,12`) + line(x + 2, y - 6, x + 2, y + 6) : path(`M${x - 4},${y - 6} a6,6 0 0,1 0,12`) + line(x - 4, y - 6, x - 4, y + 6),
};

// ------------------------------------------------------------- dispositivos
const devActive = (ctx) => !!(ctx.dev && ctx.dev.active);

// --------------------------------------------------------------------- tipos
const FUNCS = {
  ninguna: 'Ninguna',
  compresor: 'Compresor',
  vent_evap: 'Ventilador evaporador',
  vent_cond: 'Ventilador condensador',
  desescarche: 'Resistencia desescarche',
  solenoide: 'Válvula solenoide (línea de líquido)',
  luz: 'Luz de la cámara',
};

const PROBES = { camara: 'Aire cámara', evaporador: 'Batería evaporador', producto: 'Género', exterior: 'Ambiente exterior' };

const nameProp = { key: 'name', label: 'Descripción', type: 'text' };
const tagProp = { key: 'tag', label: 'Etiqueta', type: 'text' };

function twoTermBox() {
  return [-1.5, 0, 1, 3];
}

const TYPES = {
  // ============================================================ alimentación
  supply3: {
    label: 'Red trifásica 3F+N',
    terms: [
      { n: 'L1', x: 0, y: 0, phase: 'L1' },
      { n: 'L2', x: 2, y: 0, phase: 'L2' },
      { n: 'L3', x: 4, y: 0, phase: 'L3' },
      { n: 'N', x: 6, y: 0, phase: 'N' },
    ],
    box: [-0.6, -2.4, 6.6, 0],
    defaults: { name: '400/230 V 50 Hz' },
    props: [nameProp],
    draw(ctx) {
      let s = rect(-12, -46, 144, 26, 's fillbg');
      s += text(ctx, 60, -39, ctx.comp.props.name || '', 'tname');
      const names = ['L1', 'L2', 'L3', 'N'];
      names.forEach((n, i) => {
        s += line(i * 40, -20, i * 40, 0, `s ph-${n}`);
        s += text(ctx, i * 40, -27, n, 'tag');
      });
      return s;
    },
  },
  supply1: {
    label: 'Red monofásica L+N',
    terms: [
      { n: 'L', x: 0, y: 0, phase: 'L1' },
      { n: 'N', x: 2, y: 0, phase: 'N' },
    ],
    box: [-0.6, -2.4, 2.6, 0],
    defaults: { name: '230 V' },
    props: [nameProp],
    draw(ctx) {
      let s = rect(-12, -46, 64, 26, 's fillbg');
      s += text(ctx, 20, -39, ctx.comp.props.name || '', 'tname');
      s += line(0, -20, 0, 0, 's ph-L1') + line(40, -20, 40, 0, 's ph-N');
      s += text(ctx, 0, -27, 'L', 'tag') + text(ctx, 40, -27, 'N', 'tag');
      return s;
    },
  },
  bus: {
    label: 'Borne de alimentación',
    terms: [{ n: 'P', x: 0, y: 0, phaseProp: 'phase' }],
    box: [-0.6, -1.2, 0.6, 0],
    defaults: { phase: 'L1' },
    props: [{ key: 'phase', label: 'Fase', type: 'select', options: { L1: 'L1', L2: 'L2', L3: 'L3', N: 'N' } }],
    draw(ctx) {
      const ph = ctx.comp.props.phase;
      return line(0, -6, 0, 0) + circle(0, -14, 9, `s fillbg ph-${ph}`) + text(ctx, 0, -13.5, ph, 'tag');
    },
  },

  // ============================================================ protecciones
  mcb1: mcb(1),
  mcb2: mcb(2),
  mcb3: mcb(3),
  mcb4: mcb(4),
  fuse: {
    label: 'Fusible',
    tagPrefix: 'F',
    terms: [{ n: '1', x: 0, y: 0 }, { n: '2', x: 0, y: 3 }],
    box: twoTermBox(),
    defaults: { In: 10 },
    props: [tagProp, nameProp, { key: 'In', label: 'Calibre (A)', type: 'number', min: 0.5, step: 0.5 }],
    protective: true,
    initState: () => ({ blown: false }),
    links: (ctx) => (ctx.st.blown ? [] : [['1', '2']]),
    draw(ctx) {
      const b = ctx.st && ctx.st.blown;
      let s = rect(-6, 12, 12, 36, 's fillbg');
      s += b ? line(0, 0, 0, 24) + line(0, 36, 0, 60) + path('M-5,26 L5,34 M5,26 L-5,34', 's trip') : line(0, 0, 0, 60);
      return s + tagLabel(ctx, -12) + termNums(ctx, '1', '2');
    },
    click(sim, c, st) {
      if (st.blown) {
        st.blown = false;
        sim.log('info', `${c.props.tag}: fusible sustituido.`);
      } else {
        st.blown = true;
        sim.log('warn', `${c.props.tag}: fusible retirado (circuito abierto).`);
      }
      return true;
    },
  },
  thermal3: {
    label: 'Relé térmico (3 polos)',
    tagPrefix: 'F',
    master: 'thermal',
    terms: [
      { n: '1', x: 0, y: 0 }, { n: '2', x: 0, y: 3 },
      { n: '3', x: 2, y: 0 }, { n: '4', x: 2, y: 3 },
      { n: '5', x: 4, y: 0 }, { n: '6', x: 4, y: 3 },
    ],
    box: [-1.2, 0, 5.8, 3],
    defaults: { Iset: 4, reset: 'manual' },
    props: [
      tagProp,
      nameProp,
      { key: 'Iset', label: 'Regulación (A)', type: 'number', min: 0.1, step: 0.1 },
      { key: 'reset', label: 'Rearme', type: 'select', options: { manual: 'Manual', auto: 'Automático' } },
    ],
    // Los elementos térmicos siempre conducen; lo que abre es el contacto 95-96.
    links: () => [['1', '2'], ['3', '4'], ['5', '6']],
    draw(ctx) {
      const trip = devActive(ctx);
      let s = '';
      for (const x of [0, 40, 80]) {
        s += line(x, 0, x, 16) + rect(x - 7, 16, 14, 28, 's fillbg') + path(`M${x},16 v8 h5 v12 h-5 v8`) + line(x, 44, x, 60);
      }
      s += line(7, 30, 33, 30, 's dash') + line(47, 30, 73, 30, 's dash') + line(87, 30, 104, 30, 's dash');
      s += rect(104, 23, 14, 14, trip ? 's trip-fill' : 's fillbg');
      s += text(ctx, 111, 30.5, 'R', 'tn');
      if (ctx.dev) s += text(ctx, 111, 46, `${fmt1(ctx.dev.current)} A`, trip ? 'tn trip-t' : 'tn');
      return s + tagLabel(ctx, -12);
    },
    click(sim, c) {
      const d = sim.devices.get(c.props.tag);
      return d ? sim.resetThermal(d) : false;
    },
  },
  th_nc: {
    label: 'Contacto térmico NC 95-96',
    tagPrefix: 'F',
    slaveOf: 'thermal',
    terms: [{ n: '95', x: 0, y: 0 }, { n: '96', x: 0, y: 3 }],
    box: twoTermBox(),
    props: [tagProp],
    links: (ctx) => (devActive(ctx) ? [] : [['95', '96']]),
    draw(ctx) {
      const on = devActive(ctx);
      return contactNC(!on) + actuatorLine(on ? -2 : -6, 30) + act.thermal() + text(ctx, -46, 30, ctx.comp.props.tag, 'tag', 'end') + termNums(ctx, '95', '96');
    },
    click(sim, c) {
      const d = sim.devices.get(c.props.tag);
      return d ? sim.resetThermal(d) : false;
    },
  },
  th_no: {
    label: 'Contacto térmico NA 97-98',
    tagPrefix: 'F',
    slaveOf: 'thermal',
    terms: [{ n: '97', x: 0, y: 0 }, { n: '98', x: 0, y: 3 }],
    box: twoTermBox(),
    props: [tagProp],
    links: (ctx) => (devActive(ctx) ? [['97', '98']] : []),
    draw(ctx) {
      const on = devActive(ctx);
      return contactNO(on) + actuatorLine(on ? -1 : -6, 30) + act.thermal() + text(ctx, -46, 30, ctx.comp.props.tag, 'tag', 'end') + termNums(ctx, '97', '98');
    },
    click(sim, c) {
      const d = sim.devices.get(c.props.tag);
      return d ? sim.resetThermal(d) : false;
    },
  },

  // ================================================================== mando
  pb_no: {
    label: 'Pulsador NA (marcha)',
    tagPrefix: 'S',

function niceCeil(v) {
  const steps = [5, 10, 15, 20, 25, 30, 40, 50, 60];
  return steps.find((s) => s >= v) || Math.ceil(v / 10) * 10;
}

  /** Dibuja las esferas de los manómetros para el refrigerante actual. */
  buildGauges(refId) {
    this.refId = refId;
    const ref = getRefrigerant(refId);
    const lpMax = niceCeil(gauge(psat(ref, 22)));
    const hpMax = niceCeil(gauge(psat(ref, Math.min(68, ref.Tc - 4))) + 2);
    this.gLP = { min: -1, max: lpMax, el: this.$('gLP') };
    this.gHP = { min: 0, max: hpMax, el: this.$('gHP') };
    for (const [g, name] of [[this.gLP, 'BAJA'], [this.gHP, 'ALTA']]) {
      g.el.innerHTML = gaugeSVG(g, name, ref);
      g.needle = g.el.querySelector('.needle');
      g.val = g.el.querySelector('.g-val');
      g.sat = g.el.querySelector('.g-sat');
    }
  }

  setTag(id, s) {
    const g = this.$(id);
    const t = g.querySelector('text');
    if (t.textContent !== s) {
      t.textContent = s;
      const w = Math.ceil(t.getComputedTextLength ? t.getComputedTextLength() + 14 : s.length * 6.5 + 14);
      const r = g.querySelector('rect');
      const end = Number(r.getAttribute('x')) < 0;
      r.setAttribute('width', w);
      if (end) {
        r.setAttribute('x', -w);
        t.setAttribute('x', -w + 7);
      }
    }
    g.style.display = s ? '' : 'none';
  }

  /**
   * Actualiza la vista. o = salida del modelo, info = datos extra del
   * esquema (termostato de cámara, presostatos...), dt = segundos reales.
   */
  update(o, info, dt) {
    if (!o) return;
    if (o.refrigerant !== this.refId) this.buildGauges(o.refrigerant);
    const running = o.running;
    this.svg.classList.toggle('is-running', running);
    this.svg.classList.toggle('is-locked', !!o.locked);

    // Flujo: velocidad de los trazos proporcional al caudal.
    const flow = Math.min(o.flow, 2);
    const feed = Math.min((o.mFeed || 0) / Math.max(o.mComp || 1e-9, 1e-9), 2);
    const eqFlow = !running && o.mFeed > 1e-5 ? 0.25 : 0;
    const speeds = {
      discharge: 70 * flow,
      condenser: 45 * flow,
      condOut: 22 * flow,
      liquid: 22 * (running ? Math.max(flow * Math.min(feed, 1.3), 0) : eqFlow),
      mix: 30 * (running ? flow : eqFlow),
      evap: 34 * (running ? flow : eqFlow),
      suction: 70 * flow,
    };
    for (const [k, el] of Object.entries(this.flows)) {
      const v = speeds[k] || 0;
      this.offsets[k] = ((this.offsets[k] || 0) - v * dt) % 1600;
      el.style.strokeDashoffset = this.offsets[k];
      el.style.opacity = v > 0.5 ? Math.min(1, 0.35 + v / 60) : 0;
    }

    // Tuberías: más apagadas cuando no hay circulación.
    this.svg.classList.toggle('no-flow', !running);
    this.$('pipe-suction').classList.toggle('frosted', o.floodback || (running && o.Tsuc < -2));
    this.$('pipe-liquid').classList.toggle('flashing', o.flash > 0.05 && running);

    // Gradientes: parte en mezcla del evaporador y zona de líquido del condensador.
    const wet = Math.max(0.05, Math.min(1, o.wet));
    this.$('g-evap-a').setAttribute('offset', wet);
    this.$('g-evap-b').setAttribute('offset', wet);
    const condLiq = running ? 0.78 - Math.min(o.SC, 20) * 0.015 : 0.9;
    this.$('g-cond-a').setAttribute('offset', condLiq);
    this.$('g-cond-b').setAttribute('offset', condLiq);

    // Ventiladores, resistencia, hielo, suciedad.
    this.$('fanE').classList.toggle('on', o.fanE);
    this.$('fanC').classList.toggle('on', o.fanC);
    this.$('air').classList.toggle('on', o.fanE);
    this.$('hotair').classList.toggle('on', o.fanC && running);
    this.$('heater').classList.toggle('on', o.heater);
    this.$('ice').style.opacity = Math.min(0.9, o.iceFrac * 1.1).toFixed(3);
    this.$('ice-h').style.opacity = Math.min(0.8, o.iceFrac).toFixed(3);
    this.$('dirt').style.opacity = ((info && info.condDirt) || 0) * 0.7;

    // Puerta (animada).
    const target = o.door ? 42 : 0;
    this.doorAngle += (target - this.doorAngle) * Math.min(1, dt * 8);
    this.$('door-leaf').setAttribute('transform', `rotate(${this.doorAngle.toFixed(1)} 70 470)`);
    this.$('door-air').classList.toggle('on', o.door);
    this.$('door-t').textContent = o.door ? 'puerta ABIERTA' : 'puerta cerrada';
    this.$('door').classList.toggle('open', o.door);

    // Solenoide y visor.
    const sol = this.$('sol');
    sol.style.display = o.hasSolenoid ? '' : 'none';
    sol.classList.toggle('open', o.solOpen);
    this.$('bubbles').classList.toggle('on', o.flash > 0.05);
    this.$('glass').classList.toggle('empty', o.flash > 0.5);

    // Recipiente.
    const lv = Math.max(0, Math.min(1, o.receiverLevel));
    const h = 166 * lv;
    const rl = this.$('recv-liq');
    rl.setAttribute('y', 418 - h);
    rl.setAttribute('height', h);

    // Compresor.
    const comp = this.$('comp');
    comp.classList.toggle('on', running);
    comp.classList.toggle('locked', !!o.locked);
    this.$('comp-spin').classList.toggle('on', running);
    let ci;
    if (running) ci = `MARCHA · ${fmt(o.current)} A · ${fmt(o.Wel, 2)} kW`;
    else if (o.locked) ci = `¡BLOQUEADO! · ${fmt(o.current)} A`;
    else ci = 'parado';
    this.$('compinfo').textContent = ci;

    // Presostatos.
    if (info) {
      this.$('pa').classList.toggle('trip', !!info.paTrip);
      this.$('pb').classList.toggle('trip', !!info.pbTrip);
      this.$('pa').style.display = info.hasPA ? '' : 'none';
      this.$('pb').style.display = info.hasPB ? '' : 'none';
    }

    // Manómetros.
    this.setGauge(this.gLP, o.PeG, o.Te);
    this.setGauge(this.gHP, o.PcG, o.Tc);

    // Textos.
    this.$('tamb').textContent = `${fmt(o.Tamb)} °C`;
    this.$('troom').textContent = `${fmt(o.Troom)} °C`;
    const th = info && info.thermostat;
    this.$('roominfo').textContent = th ? `${th.tag}: para a ${fmt(th.stop)} °C · arranca a ${fmt(th.start)} °C` : '';
    this.$('tprod').textContent = `género ${fmt(o.Tprod)} °C`;
    this.setTag('t-dis', `T descarga ${fmt(o.Tdis, 0)} °C`);
    this.setTag('t-liq', running ? `T líquido ${fmt(o.Tliq)} °C · SC ${fmt(o.SC)} K` : `T líquido ${fmt(o.Tliq)} °C`);
    this.setTag('t-filt', o.filterDT > 0.8 ? `tras filtro ${fmt(o.TafterFilter)} °C (Δ ${fmt(o.filterDT)} K)` : '');
    this.setTag('t-evin', `entrada ${fmt(o.Te)} °C`);
    this.setTag('t-evout', running ? `salida ${fmt(o.TevapOut)} °C · RC ${fmt(o.SHevap)} K` : `salida ${fmt(o.TevapOut)} °C`);
    this.setTag('t-suc', running ? `aspiración ${fmt(o.Tsuc)} °C` : `aspiración ${fmt(o.Tsuc)} °C`);
    this.setTag('t-coil', `batería ${fmt(o.Tcoil)} °C · hielo ${fmt(o.ice, 2)} kg`);
  }

  setGauge(g, p, T) {
    if (!g) return;
    const a = gaugeAngle(g, p);
    g.needle.setAttribute('transform', `rotate(${a.toFixed(1)})`);
    g.val.textContent = `${fmt(p)} bar`;
    g.sat.textContent = `${fmt(T)} °C`;
  }
}

function gaugeAngle(g, v) {
  const x = Math.max(g.min, Math.min(g.max * 1.04, v));
  return -225 + (270 * (x - g.min)) / (g.max - g.min);
}

function gaugeSVG(g, name, ref) {
  const R = 60;
  let s = `<circle class="g-face" r="${R}"/><circle class="g-rim" r="${R}"/>`;
  const span = g.max - g.min;
  const major = span <= 12 ? 1 : span <= 25 ? 5 : 5;
  const minor = span <= 12 ? 0.5 : 1;
  for (let v = g.min; v <= g.max + 1e-6; v += minor) {
    const a = (gaugeAngle(g, v) * Math.PI) / 180;
    const isMajor = Math.abs(v / major - Math.round(v / major)) < 1e-6;
    const r1 = R - 4;
    const r2 = isMajor ? R - 11 : R - 7;
    s += `<line class="${isMajor ? 'tk' : 'tk minor'}" x1="${(Math.cos(a) * r1).toFixed(1)}" y1="${(Math.sin(a) * r1).toFixed(1)}" x2="${(Math.cos(a) * r2).toFixed(1)}" y2="${(Math.sin(a) * r2).toFixed(1)}"/>`;
    if (isMajor && (span <= 12 ? Math.round(v) % 2 === 0 || v === g.min : true)) {
      const rt = R - 19;
      s += `<text class="tkl" x="${(Math.cos(a) * rt).toFixed(1)}" y="${(Math.sin(a) * rt).toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${v}</text>`;
    }
  }
  // Escala interior de temperatura de saturación (como en los manómetros reales).
  const temps = (name === 'BAJA' ? [-40, -30, -20, -10, 0, 10, 20] : [-20, 0, 20, 40, 60]).filter((t) => {
    const p = gauge(psat(ref, t));
    return p >= g.min && p <= g.max && t < ref.Tc - 2;
  });
  for (const t of temps) {
    const p = gauge(psat(ref, t));
    const a = (gaugeAngle(g, p) * Math.PI) / 180;
    const rt = R - 30;
    s += `<text class="tks" x="${(Math.cos(a) * rt).toFixed(1)}" y="${(Math.sin(a) * rt).toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${t}°</text>`;

    const wide = w > 820;

    for (const row of rows) {
      let rect;
      if (wide) {
        const rw = (w - gap * (rows.length - 1)) * row.frac;
        rect = { x: off, y: 0, w: rw, h };
        off += rw + gap;
      } else {
        const rh = (h - gap * (rows.length - 1)) * (row.series.length > 1 ? 0.4 : 0.3);
        rect = { x: 0, y: off, w, h: rh };

  _plot(g, r, row, view, tStart, tEnd, compact) {
    const ink = css('--ink-2');
    const muted = css('--muted');
    const line = css('--line');
    const L = r.x + 40, R = r.x + r.w - 44, T = r.y + 22, strip = compact ? 0 : 9;
    const B = r.y + r.h - (compact ? 4 : 18) - strip;
    const x = (t) => L + ((t - tStart) / Math.max(tEnd - tStart, 1)) * (R - L);
    let lo = Infinity, hi = -Infinity;
    for (const d of view) for (const sr of row.series) {
      lo = Math.min(lo, d[sr.k]);
      hi = Math.max(hi, d[sr.k]);
    }

      const m = (hi + lo) / 2;
      lo = m - 0.5;
      hi = m + 0.5;
    }
    const step = niceStep(hi - lo, Math.max(1, Math.min(5, Math.floor((B - T) / 26))));
    lo = Math.floor(lo / step) * step;
    hi = Math.ceil(hi / step) * step;
    const yy = (v) => B - ((v - lo) / (hi - lo)) * (B - T);
    g.lineWidth = 1;
    g.strokeStyle = line;
    g.fillStyle = muted;
    g.font = '10.5px "IBM Plex Sans", system-ui, sans-serif';
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    for (let v = lo; v <= hi + 1e-9; v += step) {
      g.beginPath();
      g.moveTo(L, Math.round(yy(v)) + 0.5);
      g.lineTo(R, Math.round(yy(v)) + 0.5);
      g.stroke();
      g.fillText(fmt(v, step < 1 ? 1 : 0), L - 5, yy(v));
    }
    // Título y leyenda.
    g.textAlign = 'left';
    g.textBaseline = 'alphabetic';
    g.fillStyle = ink;
    g.font = '600 12px "Barlow Condensed", "Arial Narrow", sans-serif';
    const title = `${row.title} (${row.unit})`;
    g.fillText(title, L, r.y + 13);
    g.font = '10.5px "IBM Plex Sans", system-ui, sans-serif';
    let lx = L + g.measureText(title).width + 12;
    if (row.series.length > 1) {
      for (const sr of row.series) {
        const tw = g.measureText(sr.label).width;
        if (lx + 14 + tw > R + 40) break;
        g.fillStyle = sr.color;
        g.fillRect(lx, r.y + 8, 10, 2.5);
        g.fillStyle = muted;
        g.fillText(sr.label, lx + 13, r.y + 13);
        lx += 22 + tw;
      }
    }
    // Series.
    g.save();
    g.beginPath();
    g.rect(L, T - 4, R - L, B - T + 8);
    g.clip();
    for (const sr of row.series) {
      g.strokeStyle = sr.color;
      g.lineWidth = sr.w || 1.5;
      g.setLineDash(sr.dash || []);
      g.beginPath();
      view.forEach((d, i) => (i ? g.lineTo(x(d.t), yy(d[sr.k])) : g.moveTo(x(d.t), yy(d[sr.k]))));
      g.stroke();
      g.setLineDash([]);
    }
    g.restore();
    const last = view[view.length - 1];
    for (const sr of row.series) {
      g.fillStyle = sr.color;
      g.beginPath();
      g.arc(x(last.t), yy(last[sr.k]), 2.8, 0, Math.PI * 2);
      g.fill();
    }
    const sr0 = row.series[0];
    g.fillStyle = sr0.color;
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.font = '500 11px "IBM Plex Mono", ui-monospace, monospace';
    g.fillText(fmt(last[sr0.k]), R + 6, yy(last[sr0.k]));
    if (compact) return;
    // Franja de estados: marcha del compresor (verde), desescarche (ámbar), puerta (gris).
    const sy = B + 4;
    const bands = [['run', css('--ok')], ['heat', css('--warn')], ['door', muted]];
    const bh = strip / bands.length;
    bands.forEach(([k, color], i) => {
      g.fillStyle = color;
      for (let j = 1; j < view.length; j++) {
        if (view[j - 1][k]) g.fillRect(x(view[j - 1].t), sy + i * bh, Math.max(1, x(view[j].t) - x(view[j - 1].t)), bh - 0.5);
      }
    });
    // Eje de tiempo.
    g.fillStyle = muted;
    g.font = '10.5px "IBM Plex Sans", system-ui, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'top';
    const span = tEnd - tStart;
    const perPx = span / Math.max(R - L, 1);
    const tstep = [60, 120, 300, 600, 900, 1800, 3600].find((st) => st / perPx > 60) || 7200;
    for (let t = Math.ceil(tStart / tstep) * tstep; t <= tEnd; t += tstep) g.fillText(clock(t), x(t), sy + strip + 3);
  }
}

    const Tmin = -60;
    const Tmax = ref.Tc - 0.5;

    for (let T = Tmin; T <= Tmax; T += 1) dome.push({ T, P: psat(ref, T), hl: hLiq(ref, T), hv: hVap(ref, T) });

    g.font = '10px "IBM Plex Sans", system-ui, sans-serif';
    // Rejilla logarítmica de presión (absoluta).
    g.strokeStyle = lineC;
    g.fillStyle = muted;
    g.lineWidth = 1;
    g.textAlign = 'right';
    g.textBaseline = 'middle';
    for (const p of [0.5, 1, 2, 5, 10, 20, 40]) {
      if (p < pMin || p > pMax) continue;
      g.beginPath();
      g.moveTo(L, Math.round(Y(p)) + 0.5);
      g.lineTo(w - R, Math.round(Y(p)) + 0.5);
      g.stroke();
      g.fillText(`${p}`, L - 6, Y(p));
    }
    g.textAlign = 'center';
    g.textBaseline = 'top';
    const hs = niceStep(hMax - hMin, 6);
    for (let hh = Math.ceil(hMin / hs) * hs; hh <= hMax; hh += hs) {
      g.beginPath();
      g.moveTo(Math.round(X(hh)) + 0.5, T);
      g.lineTo(Math.round(X(hh)) + 0.5, h - B);

    g.rotate(-Math.PI / 2);
    g.fillText('P abs (bar)', 0, -4);
    g.restore();
    // Campana de saturación.
    g.strokeStyle = ink;
    g.lineWidth = 1.6;
    g.beginPath();
    dome.forEach((d, i) => (i ? g.lineTo(X(d.hl), Y(d.P)) : g.moveTo(X(d.hl), Y(d.P))));
    for (let i = dome.length - 1; i >= 0; i--) g.lineTo(X(dome[i].hv), Y(dome[i].P));
    g.stroke();
    g.fillStyle = muted;
    g.textAlign = 'left';
    g.fillText('líquido', X(dome[12].hl) + 4, Y(dome[12].P) - 2);

    g.fillText('vapor', X(dome[12].hv) - 4, Y(dome[12].P) - 2);

    // Ciclo actual.
    const { h1, h2, h3, h4, Pe, Pc } = o.ph;
    const pts = [[h1, Pe], [h2, Pc], [h3, Pc], [h4, Pe]];
    const alpha = o.running ? 1 : 0.35;
    g.globalAlpha = alpha * 0.16;
    g.fillStyle = css('--accent');
    g.beginPath();
    pts.forEach(([hh, p], i) => (i ? g.lineTo(X(hh), Y(p)) : g.moveTo(X(hh), Y(p))));
    g.closePath();
    g.fill();
    g.globalAlpha = alpha;
    const seg = (a, b, color, dash) => {
      g.strokeStyle = color;
      g.lineWidth = 2.4;
      g.setLineDash(dash || []);
      g.beginPath();
      g.moveTo(X(a[0]), Y(a[1]));
      g.lineTo(X(b[0]), Y(b[1]));
      g.stroke();
      g.setLineDash([]);

    seg(pts[1], pts[2], css('--hp-liq'));
    seg(pts[2], pts[3], css('--lp-mix'), [5, 4]);
    seg(pts[3], pts[0], css('--lp-gas'));
    g.fillStyle = css('--ink');
    g.font = '600 12px "Barlow Condensed", "Arial Narrow", sans-serif';
    const lab = [['1', 8, 12], ['2', 8, -6], ['3', -12, -6], ['4', -12, 12]];
    pts.forEach(([hh, p], i) => {
      g.beginPath();
      g.arc(X(hh), Y(p), 3.2, 0, Math.PI * 2);
      g.fill();
      g.textAlign = 'center';
      g.fillText(lab[i][0], X(hh) + lab[i][1], Y(p) + lab[i][2] - 6);
    });
    g.globalAlpha = 1;
    // Resumen.
    const q0 = h1 - h4;
    const wk = h2 - h1;
    g.font = '11px "IBM Plex Sans", system-ui, sans-serif';
    g.textAlign = 'right';
    g.textBaseline = 'top';
    g.fillStyle = ink;
    const lines = o.running
      ? [
          `${ref.label}`,
          `baja ${fmt(gauge(Pe))} bar · alta ${fmt(gauge(Pc))} bar`,
          `efecto frigorífico h1−h4 = ${fmt(q0, 0)} kJ/kg`,
          `compresión h2−h1 = ${fmt(wk, 0)} kJ/kg`,
          `COP ≈ ${fmt(q0 / Math.max(wk, 1))}`,
        ]
      : [`${ref.label}`, 'compresor parado (ciclo del último funcionamiento)'];
    lines.forEach((l, i) => g.fillText(l, w - R - 4, T + 4 + i * 15));
  }
}

  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);

    else if (v === true) e.setAttribute(k, '');
    else e.setAttribute(k, v);

function rangeField(id, label, value, min, max, step, unit, onChange) {
  const out = h('span', { class: 'rangeval' }, `${value} ${unit}`);
  const i = h('input', { type: 'range', id, min, max, step, value });
  i.addEventListener('input', () => {
    out.textContent = `${i.value} ${unit}`;
    onChange(parseFloat(i.value));
  });
  return h('label', { class: 'field', for: id }, h('span', { style: 'display:flex;justify-content:space-between;gap:8px' }, label, out), i);
}

function selectField(id, label, value, options, onChange, disabled) {
  const s = h('select', { id, disabled }, Object.entries(options).map(([k, l]) => h('option', { value: k, selected: k === value }, l)));
  s.addEventListener('change', () => onChange(s.value));
  return h('label', { class: 'field', for: id }, label, s);
}

function numField(id, label, value, min, max, step, onChange, disabled) {
  const i = h('input', { type: 'number', id, value, min, max, step, disabled, inputmode: 'decimal' });
  i.addEventListener('change', () => {
    const v = parseFloat(String(i.value).replace(',', '.'));
    if (Number.isFinite(v)) onChange(Math.min(max, Math.max(min, v)));
  });
  return h('label', { class: 'field', for: id }, label, i);
}

    case 'mcb2':
    case 'mcb3':
    case 'mcb4':

      ['Compresor', o && (o.running || o.locked), o && o.locked ? 'bad' : '', has('compresor')],
      ['Vent. cond.', o && o.fanC, '', has('vent_cond')],
      ['Vent. evap.', o && o.fanE, '', has('vent_evap')],
      ['Desescarche', o && o.heater, 'warn', has('desescarche')],
      ['Solenoide', o && o.hasSolenoid && o.solOpen, '', has('solenoide')],
      ['Puerta', o && o.door, 'warn', true],
    ];
    const key = JSON.stringify(chips);
    if (key === this._chipsKey) return;
    this._chipsKey = key;
    el.innerHTML = '';
    for (const [label, on, cls, avail] of chips) {
      el.append(h('span', { class: `chip ${cls}${on ? ' on' : ''}${avail ? '' : ' absent'}`, title: avail ? '' : 'No hay ningún componente con esta función frigorífica en el esquema' }, h('i'), label));
    }
  }

  // --------------------------------------------------------------- registro
  log(level, msg, t) {
    const e = { level, msg, t: t ?? (this.sim ? this.sim.time : 0) };
    this.panels.addLog(e);
    if (['cause', 'warn', 'error'].includes(level)) this.toast(msg, level);
    if (this.ui.tab !== 'log') {
      this.unread = (this.unread || 0) + 1;
      const b = document.getElementById('log-badge');
      b.hidden = false;
      b.textContent = this.unread > 99 ? '99+' : String(this.unread);
    }
  }

  toast(msg, level) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${level}`;
    el.hidden = false;
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => (el.hidden = true), 7000);
  }

  snack(msg, action) {
    let el = document.getElementById('snack');
    if (!el) {
      el = h('div', { id: 'snack', class: 'snack', role: 'status' });
      document.body.append(el);
    }
    el.innerHTML = '';
    el.append(h('span', {}, msg));
    if (action) {
      el.append(h('button', { class: 'btn small', onclick: () => {
        el.hidden = true;
        action.fn();
      } }, action.label));
    }
    el.hidden = false;
    clearTimeout(this._snackT);
    this._snackT = setTimeout(() => (el.hidden = true), action ? 9000 : 4000);
  }

  // ------------------------------------------------------------------- UI
  buildPalette() {
    const pal = document.getElementById('palette');
    pal.innerHTML = '';
    for (const cat of PALETTE) {
      const items = h('div', { class: 'pal-items' });
      for (const item of cat.items) {
        const T = TYPES[item.type];
        const c = { id: 'p', type: item.type, x: 0, y: 0, rot: 0, props: { ...(T.defaults || {}), ...item.props, tag: '', name: '' } };
        const b = T.getBox ? T.getBox(c) : T.box;
        const pad = 6;
        const vb = `${b[0] * G - pad} ${b[1] * G - pad} ${(b[2] - b[0]) * G + 2 * pad} ${(b[3] - b[1]) * G + 2 * pad}`;
        const btn = h('button', { class: 'pal-item', title: T.label, type: 'button' });
        btn.innerHTML = `<svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${renderSymbol(c, { st: T.initState ? T.initState(c) : {} })}</svg>`;
        btn.append(h('span', {}, item.label));
        btn.addEventListener('click', () => {
          if (this.sim) return;
          for (const x of pal.querySelectorAll('.pal-item.on')) x.classList.remove('on');
          btn.classList.add('on');
          this.editor.startPlace(item);
          this.root.classList.remove('pal-open');
        });
        items.append(btn);
      }
      pal.append(h('div', { class: `pal-cat${cat.cat === 'Frigorífico' ? ' fridge-cat' : ''}` }, h('h3', {}, cat.cat), items));
    }
  }

  bindToolbar() {
    const $ = (id) => document.getElementById(id);
    const sel = $('sel-example');
    const fill = () => {
      sel.innerHTML = '';
      sel.append(h('option', { value: '', selected: true, disabled: true }, 'Abrir ejemplo…'));
      const og = h('optgroup', { label: 'Ejemplos' });
      for (const e of EXAMPLES) og.append(h('option', { value: e.id }, e.build().name));
      sel.append(og, h('optgroup', { label: 'Nuevo' }, h('option', { value: 'blank-3f' }, 'Esquema en blanco (3F+N)'), h('option', { value: 'blank-1f' }, 'Esquema en blanco (L+N)')));
    };
    fill();
    sel.addEventListener('change', () => {
      const v = sel.value;
      if (v === 'blank-3f') this.loadProject(blankProject('3f'), { undoable: true });
      else if (v === 'blank-1f') this.loadProject(blankProject('1f'), { undoable: true });
      else if (v) this.loadProject(buildExample(v), { undoable: true });
      sel.value = '';
    });
    $('btn-open').addEventListener('click', () => $('file-input').click());
    $('file-input').addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) this.openFile(f);
      e.target.value = '';
    });
    $('btn-save').addEventListener('click', () => this.download());
    $('btn-undo').addEventListener('click', () => this.editor.undo());
    $('btn-redo').addEventListener('click', () => this.editor.redo());
    for (const b of document.querySelectorAll('.tool')) b.addEventListener('click', () => this.editor.setTool(b.dataset.tool));
    $('btn-rotate').addEventListener('click', () => this.editor.rotateSelection());
    $('btn-delete').addEventListener('click', () => this.editor.deleteSelection());
    $('btn-sim').addEventListener('click', () => this.toggleSim());
    $('btn-pause').addEventListener('click', () => this.togglePause());
    const speed = $('sel-speed');
    speed.value = String(this.ui.speed);
    speed.addEventListener('change', () => {
      this.ui.speed = Number(speed.value);
      this.saveUI();
    });
    $('btn-fridge').addEventListener('click', () => this.setRefrigEnabled(!this.refrigOn()));
    $('btn-fridge-on').addEventListener('click', () => this.setRefrigEnabled(true));
    $('btn-theme').addEventListener('click', () => {
      const dark = this.effectiveDark();
      this.ui.theme = dark ? 'light' : 'dark';
      this.saveUI();
      this.applyUI();
    });
    $('btn-zoom-in').addEventListener('click', () => this.editor.zoomAt(1.25));
    $('btn-zoom-out').addEventListener('click', () => this.editor.zoomAt(0.8));
    $('btn-fit').addEventListener('click', () => this.editor.zoomToFit());
    $('btn-parts-mobile').addEventListener('click', () => this.root.classList.toggle('pal-open'));
    for (const b of document.querySelectorAll('.viewtabs [data-view]')) {
      b.addEventListener('click', () => {
        this.root.dataset.view = b.dataset.view;
        for (const x of document.querySelectorAll('.viewtabs [data-view]')) x.classList.toggle('on', x === b);
        if (b.dataset.view === 'elec') requestAnimationFrame(() => this.editor.zoomToFit());
      });
    }
    for (const t of document.querySelectorAll('.tabs [role="tab"]')) t.addEventListener('click', () => this.selectTab(t.dataset.tab));
    $('btn-dock').addEventListener('click', () => {
      this.ui.collapsed = !this.ui.collapsed;
      this.saveUI();
      this.applyUI();
    });
    for (const b of document.querySelectorAll('.chart-tools [data-win]')) {
      b.addEventListener('click', () => {
        this.ui.win = Number(b.dataset.win);
        this.trend.window = this.ui.win;
        for (const x of document.querySelectorAll('.chart-tools [data-win]')) x.classList.toggle('on', x === b);
        this.trend.draw();
        this.saveUI();
      });
    }
    for (const x of document.querySelectorAll('.chart-tools [data-win]')) x.classList.toggle('on', Number(x.dataset.win) === this.ui.win);
    $('btn-log-clear').addEventListener('click', () => this.panels.clearLog());

    document.addEventListener('keydown', (e) => {
      const tag = (e.target && e.target.tagName) || '';
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) return;
      if (e.key === ' ' && this.sim) {
        e.preventDefault();
        this.togglePause();
        return;
      }
      if ((e.key === 'p' || e.key === 'P') && this.sim && !e.ctrlKey && !e.metaKey) {
        this.togglePause();
        return;
      }
      if (this.editor.key(e)) e.preventDefault();
    });
  }

  selectTab(tab) {
    this.ui.tab = tab;
    for (const t of document.querySelectorAll('.tabs [role="tab"]')) t.setAttribute('aria-selected', String(t.dataset.tab === tab));
    for (const p of document.querySelectorAll('.panel[data-panel]')) p.hidden = p.dataset.panel !== tab;
    if (this.ui.collapsed) {
      this.ui.collapsed = false;
      this.applyUI();
    }
    if (tab === 'log') {
      this.unread = 0;
      document.getElementById('log-badge').hidden = true;
    }
    if (tab === 'diag') this.panels.renderDiag();
    if (tab === 'chart') requestAnimationFrame(() => this.trend.draw());
    if (tab === 'ph') requestAnimationFrame(() => this.ph.draw(this.fridgeOut()));
    this.saveUI();
  }

  bindLayout() {
    const split = document.getElementById('splitter');
    split.addEventListener('pointerdown', (e) => {
      split.setPointerCapture(e.pointerId);
      split.classList.add('dragging');
      const stage = document.getElementById('stage').getBoundingClientRect();
      const move = (ev) => {
        this.ui.split = Math.max(0.25, Math.min(0.78, (ev.clientX - stage.left) / stage.width));
        this.root.style.setProperty('--split', this.ui.split);
      };
      const up = () => {
        split.classList.remove('dragging');
        split.removeEventListener('pointermove', move);
        split.removeEventListener('pointerup', up);
        this.saveUI();
      };
      split.addEventListener('pointermove', move);
      split.addEventListener('pointerup', up);
    });
    split.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        this.ui.split = Math.max(0.25, Math.min(0.78, this.ui.split + (e.key === 'ArrowLeft' ? -0.03 : 0.03)));
        this.root.style.setProperty('--split', this.ui.split);
        this.saveUI();
      }
    });
    const rs = document.getElementById('dock-resize');
    rs.addEventListener('pointerdown', (e) => {
      rs.setPointerCapture(e.pointerId);
      const move = (ev) => {
        const hgt = Math.max(120, Math.min(window.innerHeight * 0.7, window.innerHeight - ev.clientY));
        this.ui.dock = Math.round(hgt);
        this.ui.collapsed = false;
        this.applyUI();
      };
      const up = () => {
        rs.removeEventListener('pointermove', move);
        rs.removeEventListener('pointerup', up);
        this.saveUI();
      };
      rs.addEventListener('pointermove', move);
      rs.addEventListener('pointerup', up);
    });
    const ro = new ResizeObserver(() => {
      if (this.ui.tab === 'chart') this.trend.draw();
      if (this.ui.tab === 'ph') this.ph.draw(this.fridgeOut());
    });
    ro.observe(document.querySelector('.panels'));
    window.addEventListener('hashchange', () => {
      const id = location.hash.slice(1);
      if (EXAMPLES.some((e) => e.id === id)) this.loadProject(buildExample(id), { undoable: true });
    });
  }

  effectiveDark() {
    const t = document.documentElement.dataset.theme;
    if (t) return t === 'dark';
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  applyUI() {
    const r = this.root;
    if (this.ui.theme) document.documentElement.dataset.theme = this.ui.theme;
    r.style.setProperty('--split', this.ui.split);
    if (this.ui.dock && window.innerWidth > 860) r.style.setProperty('--dock-h', `${this.ui.dock}px`);
    r.classList.toggle('dock-collapsed', !!this.ui.collapsed);
    this.selectTabQuiet(this.ui.tab);
  }

  selectTabQuiet(tab) {
    for (const t of document.querySelectorAll('.tabs [role="tab"]')) t.setAttribute('aria-selected', String(t.dataset.tab === tab));
    for (const p of document.querySelectorAll('.panel[data-panel]')) p.hidden = p.dataset.panel !== tab;
  }

  updateToolbar() {
    const r = this.root;
    const sim = !!this.sim;
    r.classList.toggle('sim-mode', sim);
    r.classList.toggle('paused', sim && this.paused);
    r.classList.toggle('no-fridge', !this.refrigOn());
    if (!this.refrigOn() && r.dataset.view === 'fridge') r.dataset.view = 'elec';
    document.getElementById('fridge-off').hidden = true;
    const btn = document.getElementById('btn-sim');
    btn.innerHTML = sim ? '<svg><use href="#i-stop"/></svg><span>Editar</span>' : '<svg><use href="#i-play"/></svg><span>Simular</span>';
    btn.title = sim ? 'Detener la simulación y volver a editar' : 'Simular el esquema';
    const pause = document.getElementById('btn-pause');
    pause.innerHTML = this.paused ? '<svg><use href="#i-play"/></svg>' : '<svg><use href="#i-pause"/></svg>';
    pause.title = this.paused ? 'Continuar (P)' : 'Pausa (P)';
    document.getElementById('mode-chip').textContent = sim ? (this.paused ? 'PAUSA' : 'SIMULANDO') : 'EDICIÓN';
    document.getElementById('btn-fridge').setAttribute('aria-pressed', String(this.refrigOn()));
    for (const b of document.querySelectorAll('.tool')) b.classList.toggle('on', b.dataset.tool === this.editor.tool);
    document.getElementById('btn-undo').disabled = !this.editor.history.length;
    document.getElementById('btn-redo').disabled = !this.editor.future.length;
    if (!sim) document.getElementById('sim-clock').textContent = '0:00:00';
    if (this.editor.tool !== 'place') for (const x of document.querySelectorAll('.pal-item.on')) x.classList.remove('on');
    const hintEl = document.getElementById('elec-hint');
    if (sim) hintEl.textContent = 'Simulando: clic en pulsadores, interruptores, protecciones, presostatos o en la puerta · Espacio = pausa';
  }
}

function boot() {
  window.frigosimu = new App();
}
if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', boot);
else boot();

return {  };
})();
})();
</script>
