<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrigoSIMU</title>
<meta name="description" content="Simulador de instalaciones frigoríficas con su esquema eléctrico: toca cualquier pieza y mira qué pasa con presiones y temperaturas. Incluye diagnóstico de averías a partir de lecturas reales.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23ad5724'/%3E%3Cpath d='M12 3.5v17M4.6 7.75l14.8 8.5M4.6 16.25l14.8-8.5' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* FrigoSIMU — estilos */

:root {
  --paper: #edf1f4;
  --panel: #ffffff;
  --panel-2: #f5f7f9;
  --line: #d5dde4;
  --line-strong: #b3c0cb;
  --ink: #15212c;
  --ink-2: #394856;
  --muted: #647585;
  --accent: #ad5724;
  --accent-ink: #ffffff;
  --accent-soft: #f5e5da;
  --focus: #1f6fd1;
  --canvas: #fbfcfd;
  --grid: #cfd8e0;
  --sym: #1d2833;
  --sym-bg: #fbfcfd;
  --select: #1f6fd1;
  --live: #d4332a;
  --neutral: #1f62c6;
  --short: #e2940b;
  --hp-gas: #d4332a;
  --hp-liq: #e0701f;
  --lp-mix: #3ba4dc;
  --lp-gas: #2157c2;
  --ok: #1c8a4d;
  --warn: #c48507;
  --bad: #cc372c;
  --room: #e6f0f7;
  --room-line: #9fbfd5;
  --unit: #f2f4f6;
  --unit-line: #b8c4ce;
  --shell: #8a5a36;
  --ice: #ffffff;
  --housing: #dde5ec;
  --glow: 0.55;
  --shadow: 0 1px 2px rgba(21, 33, 44, 0.08), 0 6px 20px rgba(21, 33, 44, 0.08);
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --dock-h: 200px;
  --split: 0.56;
  --shadow-lg: 0 2px 6px rgba(21, 33, 44, 0.1), 0 18px 48px rgba(21, 33, 44, 0.2);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0c1116;
    --panel: #131a22;
    --panel-2: #18212b;
    --line: #25313d;
    --line-strong: #354453;
    --ink: #e4ebf1;
    --ink-2: #b6c3cf;
    --muted: #8394a4;
    --accent: #e38a51;
    --accent-ink: #1c0e05;
    --accent-soft: #3a2517;
    --focus: #5aa2ff;
    --canvas: #0e141a;
    --grid: #223040;
    --sym: #d3dce6;
    --sym-bg: #0e141a;
    --select: #5aa2ff;
    --live: #ff5b50;
    --neutral: #5c9cff;
    --short: #ffb020;
    --hp-gas: #ff5a4e;
    --hp-liq: #ff9142;
    --lp-mix: #5cc5f5;
    --lp-gas: #4f88ff;
    --ok: #3cbc75;
    --warn: #e6a82c;
    --bad: #ff5d52;
    --room: #11202c;
    --room-line: #2d4b61;
    --unit: #141b22;
    --unit-line: #33414e;
    --shell: #6e4a30;
    --ice: #e8f4ff;
    --housing: #1c2833;
    --glow: 0.8;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 2px 6px rgba(0, 0, 0, 0.5), 0 18px 48px rgba(0, 0, 0, 0.55);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0c1116;
  --panel: #131a22;
  --panel-2: #18212b;
  --line: #25313d;
  --line-strong: #354453;
  --ink: #e4ebf1;
  --ink-2: #b6c3cf;
  --muted: #8394a4;
  --accent: #e38a51;
  --accent-ink: #1c0e05;
  --accent-soft: #3a2517;
  --focus: #5aa2ff;
  --canvas: #0e141a;
  --grid: #223040;
  --sym: #d3dce6;
  --sym-bg: #0e141a;
  --select: #5aa2ff;
  --live: #ff5b50;
  --neutral: #5c9cff;
  --short: #ffb020;
  --hp-gas: #ff5a4e;
  --hp-liq: #ff9142;
  --lp-mix: #5cc5f5;
  --lp-gas: #4f88ff;
  --ok: #3cbc75;
  --warn: #e6a82c;
  --bad: #ff5d52;
  --room: #11202c;
  --room-line: #2d4b61;
  --unit: #141b22;
  --unit-line: #33414e;
  --shell: #6e4a30;
  --ice: #e8f4ff;
  --housing: #1c2833;
  --glow: 0.8;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 20px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 2px 6px rgba(0, 0, 0, 0.5), 0 18px 48px rgba(0, 0, 0, 0.55);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  overflow-y: auto;
}
button, select, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }


/* ---------------------------------------------------------------- layout */
.app {
  height: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
}
.app[data-mode="sim"],
.app[data-mode="practice"] {
  /* En pantallas bajas el circuito conserva su altura y la página se desplaza. */
  height: auto;
  min-height: 100%;
  grid-template-rows: auto auto auto minmax(340px, 1fr) auto var(--dock-h);
  grid-template-areas: "top" "simbar" "readings" "stage" "story" "dock";
}
.app[data-mode="edit"] { grid-template-rows: auto minmax(0, 1fr) var(--dock-h); grid-template-areas: "top" "stage" "dock"; }
.app[data-mode="diag"] { grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top" "stage"; }
.topbar { grid-area: top; }
.simbar { grid-area: simbar; }
.readings { grid-area: readings; }
.stage, .diagpage { grid-area: stage; }
.story { grid-area: story; }
.dock { grid-area: dock; }
.app.no-fridge .pane-fridge, .app.no-fridge .readings, .app.no-fridge .splitter { display: none !important; }
.app.no-fridge .pane-elec { flex: 1 1 0 !important; border-left: 0 !important; }
.app.dock-collapsed { --dock-h: 38px; }

/* ---------------------------------------------------------------- topbar */
.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 16px;
  padding: 7px 14px;
  padding-top: calc(7px + env(safe-area-inset-top, 0px));
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 5;
}
.brand { display: flex; align-items: center; gap: 7px; }
.brand-mark { width: 24px; height: 24px; color: var(--accent); }
.brand-name { font: 600 21px/1 var(--font-display); letter-spacing: 0.02em; }
.brand-name b { font-weight: 700; color: var(--accent); }
.modes { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); }
.modes button {
  height: 32px;
  padding: 0 14px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--ink-2);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.modes button:hover { color: var(--ink); background: var(--panel); }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tb-group { display: flex; align-items: center; gap: 4px; }
.tb-right { margin-left: auto; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
  color: var(--ink-2);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.btn:hover { background: var(--panel-2); border-color: var(--line-strong); color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.icon { padding: 0 7px; }
.btn.small { height: 28px; padding: 0 9px; font-size: 13px; }
.btn.small svg { width: 15px; height: 15px; }
.btn.icon.small { padding: 0 6px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); background: var(--accent); color: var(--accent-ink); }
.btn.tool.on, .btn.toggle[aria-pressed="true"], .btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.danger { color: var(--bad); }
.select-btn select {
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
  padding: 0 8px;
  max-width: 260px;
  font-weight: 500;
}

/* ---------------------------------------------------------------- simbar */
.simbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  padding: 6px 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.sb-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.speeds { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.speeds button {
  height: 30px;
  min-width: 36px;
  border: 0;
  border-right: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink-2);
  font: 500 12.5px var(--font-mono);
  cursor: pointer;
}
.speeds button:last-child { border-right: 0; }
.speeds button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.app.paused #btn-pause { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.sim-clock {
  font: 500 14px var(--font-mono);
  font-variant-numeric: tabular-nums;
  color: var(--ink-2);
  padding: 4px 8px;
  border-radius: 6px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  min-width: 72px;
  text-align: center;
}
.sim-clock.ff { color: var(--accent); border-color: var(--accent); }
.quick { margin-left: auto; gap: 6px; }
.qc {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 4px 0 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
}
.qc > span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.qc .stepper { height: 26px; }
.qc .step-v { width: 42px; }
.qc .ctl-step > .ctl-l { display: none; }
.qc .step-b { width: 24px; font-size: 16px; }
.qc .step-u { padding-right: 4px; }
.qc select { height: 26px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); font-weight: 600; padding: 0 4px; }
.qc.btns { padding: 0 3px; gap: 3px; }
.qc .btn.small { height: 26px; padding: 0 8px; border-color: transparent; background: none; }
.qc .btn.small:hover { background: var(--panel); border-color: var(--line); }
.qc .btn.small.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.qc label, label.qc { cursor: pointer; }

/* ---------------------------------------------------------------- lecturas */
.readings {
  display: flex;
  gap: 8px;
  padding: 6px 12px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.rd {
  flex: 1 1 0;
  min-width: 158px;
  padding: 4px 10px 5px;
  border: 1px solid var(--line);
  border-top: 3px solid var(--line-strong);
  border-radius: 8px;
  background: var(--panel);
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.rd:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.rd-lp { border-top-color: var(--lp-gas); }
.rd-hp { border-top-color: var(--hp-gas); }
.rd-comp { border-top-color: var(--ink-2); }
.rd-room { border-top-color: var(--ok); }
.rd-perf { border-top-color: var(--accent); }
.rd-verdict { flex: 1.15 1 0; min-width: 200px; }
.rd-verdict[data-state="ok"] { border-top-color: var(--ok); }
.rd-verdict[data-state="warn"] { border-top-color: var(--warn); background: color-mix(in srgb, var(--warn) 7%, var(--panel)); }
.rd-verdict[data-state="bad"] { border-top-color: var(--bad); background: color-mix(in srgb, var(--bad) 7%, var(--panel)); }
.rd-verdict[data-state="idle"] { border-top-color: var(--line-strong); }
.rd-h { display: flex; justify-content: space-between; align-items: center; gap: 6px; font: 600 12px var(--font-display); letter-spacing: 0.12em; color: var(--muted); }
.rd-ref { font: 600 12px var(--font-display); letter-spacing: 0.04em; color: var(--accent); background: var(--accent-soft); border-radius: 9px; padding: 1px 7px; }
.rd-main { display: flex; align-items: baseline; gap: 4px; margin: 0 0 2px; white-space: nowrap; }
.rd-v { font: 600 22px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.rd-u { font-size: 12px; color: var(--muted); }
.rd-p { font: 500 11px var(--font-mono); color: var(--accent); white-space: nowrap; }
.rd-p:empty { display: none; }
.rd-rows { margin: 0; display: grid; gap: 1px; }
.rd-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 1.3; }
.rd-row dt { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rd-dd { display: flex; gap: 4px; align-items: baseline; flex: none; }
.rd-row dd { margin: 0; font: 500 12px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.rd-row.lv-ok dd { color: var(--ok); }
.rd-row.lv-high dd, .rd-row.lv-low dd, .rd-v.lv-high, .rd-v.lv-low { color: var(--bad); }
.rd-row.lv-high dd::after { content: " ▲"; font-size: 9px; }
.rd-row.lv-low dd::after { content: " ▼"; font-size: 9px; }
.rd-vt { margin: 2px 0 2px; font-weight: 600; font-size: 14px; line-height: 1.3; }
.rd-vs { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------------------------------------------------------------- stage */
.stage { display: flex; min-width: 0; min-height: 0; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--canvas); }
.app[data-mode="sim"] .pane-fridge, .app[data-mode="practice"] .pane-fridge { flex: var(--split) 1 0; }
.app[data-mode="sim"] .pane-elec, .app[data-mode="practice"] .pane-elec { flex: calc(1 - var(--split)) 1 0; border-left: 1px solid var(--line); }
.app[data-mode="edit"] .pane-elec { flex: 1 1 0; }
.pane-head {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  padding: 3px 10px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.pane-head h2 { margin: 0; font: 600 15px var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.pane-hint { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pane-spacer { flex: 1; }
.edit-tools { display: flex; gap: 3px; }
.canvas-wrap { position: relative; flex: 1; min-height: 0; }
.canvas-wrap > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.fridge-wrap > svg { touch-action: manipulation; }
.hint {
  min-height: 26px;
  padding: 4px 10px;
  font-size: 12px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  background: var(--panel);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.splitter { width: 6px; cursor: col-resize; background: var(--panel-2); border-left: 1px solid var(--line); flex: none; }
.splitter:hover, .splitter.dragging { background: var(--accent-soft); }
.banner {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  max-width: calc(100% - 24px);
  padding: 8px 14px;
  border-radius: 6px;
  background: var(--bad);
  color: #fff;
  font-weight: 600;
  box-shadow: var(--shadow);
}

/* ---------------------------------------------------------------- palette */
.palette {
  width: 188px;
  flex: none;
  overflow-y: auto;
  background: var(--panel);
  border-right: 1px solid var(--line);
  padding: 8px 8px 24px;
}
.pal-cat { margin-top: 10px; }
.pal-cat h3 { margin: 0 4px 6px; font: 600 12px var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.pal-cat.fridge-cat h3 { color: var(--accent); }
.pal-items { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pal-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 5px 3px 6px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: none;
  cursor: pointer;
  color: var(--ink-2);
  font-size: 11px;
  line-height: 1.2;
  text-align: center;
}
.pal-item:hover { background: var(--panel-2); border-color: var(--line); }
.pal-item.on { background: var(--accent-soft); border-color: var(--accent); }
.pal-item svg { width: 52px; height: 40px; }
.pal-item span { overflow-wrap: anywhere; hyphens: auto; }
#btn-parts-mobile { display: none; }

/* ---------------------------------------------------------------- story */
.story { background: var(--panel); border-top: 1px solid var(--line); }
.story-now { display: flex; align-items: center; gap: 10px; padding: 7px 14px; min-height: 42px; }
.story-now p { margin: 0; flex: 1; font-size: 13.5px; line-height: 1.4; }
.story-ic {
  flex: none;
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent);
  font: 700 13px var(--font-display);
}
.story-now[data-level="warn"] .story-ic { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.story-now[data-level="error"] .story-ic { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
.story-now[data-level="result"] .story-ic { background: var(--panel-2); color: var(--ink-2); }
.story-pred {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 7px 14px;
  border-top: 1px dashed var(--line);
  background: color-mix(in srgb, var(--accent) 6%, var(--panel));
  font-size: 13px;
  line-height: 1.45;
}
.story-pred b { color: var(--accent); }
.story-pred p { margin: 0; flex: 1; }
.story-pred .card-x { font-size: 20px; margin-top: -3px; }
.pred-note { color: var(--ink-2); }
.app[data-mode="practice"] .story-now { display: none; }

/* ---------------------------------------------------------------- dock */
.dock {
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--panel);
  border-top: 1px solid var(--line);
  position: relative;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.dock-resize { position: absolute; left: 0; right: 0; top: -4px; height: 8px; cursor: row-resize; z-index: 2; }
.tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 2px 8px 0;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: none;
  flex: none;
}
.tabs [role="tab"] {
  height: 34px;
  padding: 0 12px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--muted);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.tabs [role="tab"]:hover { color: var(--ink); }
.tabs [role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.app.dock-collapsed #btn-dock svg { transform: rotate(180deg); }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 11px; line-height: 18px; text-align: center; }
.panels { flex: 1; min-height: 0; position: relative; }
.panel { position: absolute; inset: 0; overflow: auto; padding: 12px 16px 16px; }
.chart-panel { display: flex; flex-direction: column; padding: 6px 12px 8px; }
.chart-panel canvas { flex: 1; min-height: 0; width: 100%; display: block; }
.chart-tools, .log-tools { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding-bottom: 4px; flex-wrap: wrap; }
.log-tools { justify-content: space-between; }
.chart-legend { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.chart-legend i { display: inline-block; width: 12px; height: 4px; border-radius: 2px; margin-left: 8px; }
.lg-run { background: var(--ok); }
.lg-heat { background: var(--warn); }
.lg-door { background: var(--muted); }
.seg { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 12px; color: var(--ink-2); }
.seg.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.pill { display: inline-block; min-width: 46px; padding: 1px 6px; border-radius: 9px; font-size: 11px; font-weight: 600; text-align: center; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.high, .pill.low { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.na, .pill.info { background: var(--panel-2); color: var(--muted); }

/* ---------------------------------------------------------------- tarjetas */
.card {
  position: fixed;
  z-index: 40;
  width: min(390px, calc(100vw - 24px));
  max-height: calc(100vh - 70px);
  overflow: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  animation: card-in 0.16s ease-out;
}
.card.sheet {
  left: 0 !important;
  right: 0;
  top: auto !important;
  bottom: 0;
  width: 100%;
  max-height: 72vh;
  border-radius: 14px 14px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@keyframes card-in { from { opacity: 0; transform: translateY(6px); } }
.card-head {
  position: sticky;
  top: 0;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px 8px 14px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  z-index: 1;
}
.card-kicker { font: 600 11.5px var(--font-display); letter-spacing: 0.12em; color: var(--accent); }
.card-head h3 { margin: 0; font: 600 19px/1.15 var(--font-display); letter-spacing: 0.01em; text-wrap: balance; }
.card-x { border: 0; background: none; font-size: 24px; line-height: 1; color: var(--muted); cursor: pointer; padding: 0 4px; }
.card-x:hover { color: var(--ink); }
.card-body { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.card-what { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
.card-live { margin: 0; font: 500 13px var(--font-mono); color: var(--ink); }
.card-sec { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.card-sec h4 { margin: 0; font: 600 12px var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.card-why { padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12.5px; line-height: 1.45; }
.card-why p { margin: 4px 0 0; }
.card-why p.on::before { content: "● "; color: var(--ok); }
.card-why p.off::before { content: "● "; color: var(--muted); }
.why-k { font: 600 11px var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.vals { margin: 0; display: grid; gap: 3px; }
.vrow { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.vrow dt { color: var(--muted); }
.vrow dd { margin: 0; text-align: right; font: 500 12.5px var(--font-mono); font-variant-numeric: tabular-nums; }
.vrow dd.bad { color: var(--bad); font-weight: 600; }
.vrow dd.warn { color: var(--warn); font-weight: 600; }
.vrow dd.ok { color: var(--ok); }
.ctl { display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
.ctl-l { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-2); }
.ctl-v { font: 500 12.5px var(--font-mono); color: var(--accent); }
.ctl-step { flex-direction: row; align-items: center; justify-content: space-between; }
.stepper { display: inline-flex; align-items: center; height: 32px; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
.step-b { width: 32px; height: 100%; border: 0; background: var(--panel-2); color: var(--ink); font-size: 18px; cursor: pointer; }
.step-b:hover { background: var(--accent-soft); color: var(--accent); }
.step-v { width: 64px; height: 100%; border: 0; text-align: center; background: var(--panel); font: 600 14px var(--font-mono); color: var(--ink); }
.step-u { padding-right: 6px; font-size: 12px; color: var(--muted); }
.ctl-range input { width: 100%; accent-color: var(--accent); }
.ctl-toggle { flex-direction: row; align-items: center; gap: 10px; cursor: pointer; }
.ctl-toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ctl-toggle .sw { flex: none; width: 38px; height: 22px; border-radius: 11px; background: var(--line-strong); position: relative; transition: background 0.15s; }
.ctl-toggle .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
.ctl-toggle input:checked + .sw { background: var(--accent); }
.ctl-toggle.danger input:checked + .sw { background: var(--bad); }
.ctl-toggle input:checked + .sw::after { transform: translateX(16px); }
.ctl-toggle input:focus-visible + .sw { outline: 2px solid var(--focus); outline-offset: 2px; }
.segs { display: flex; flex-wrap: wrap; gap: 4px; }
.segb { height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink-2); cursor: pointer; font-size: 12.5px; }
.segb:hover { border-color: var(--line-strong); color: var(--ink); }
.segb.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.ctl-sel .ctl-select { width: 100%; }
.vd-box { display: flex; flex-direction: column; gap: 8px; }
.vd-now { margin: 0; font-size: 13px; line-height: 1.45; padding: 8px 10px; border-radius: 8px; background: var(--panel-2); border-left: 3px solid var(--line-strong); }
.vd-now.ok { border-left-color: var(--ok); }
.vd-now.warn { border-left-color: var(--warn); }
.vd-now.bad { border-left-color: var(--bad); }
.vd-box .dg-hyp { margin: 0; }
.vd-box .dg-bar { width: 56px; }
.vd-box .dg-hname { font-size: 13.5px; }
.ctl-select, .card select { height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); padding: 0 8px; font-weight: 500; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.ptconv .pt-row { display: flex; align-items: center; gap: 6px; font-size: 13px; flex-wrap: wrap; }
.ptconv .step-v { width: 70px; height: 30px; border: 1px solid var(--line); border-radius: 6px; }
.ptconv output { font: 500 12.5px var(--font-mono); color: var(--accent); }

/* ------------------------------------------------------ página diagnóstico */
.diagpage { overflow: auto; padding: 18px 22px 40px; background: var(--paper); }
.dg-intro { max-width: 80ch; margin-bottom: 14px; }
.dg-intro h2 { margin: 0 0 4px; font: 600 26px var(--font-display); letter-spacing: 0.01em; }
.dg-intro p { margin: 0; color: var(--ink-2); }
.dg-cols { display: grid; grid-template-columns: minmax(300px, 460px) minmax(0, 1fr); gap: 22px; align-items: start; }
.dg-form { display: flex; flex-direction: column; gap: 12px; }
.dg-fs { margin: 0; padding: 10px 14px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); display: flex; flex-direction: column; gap: 9px; }
.dg-fs legend { padding: 0 6px; font: 600 13px var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
.dg-f { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 10px; }
.dg-l { font-size: 13px; color: var(--ink-2); display: flex; flex-direction: column; }
.dg-l small { font-size: 11.5px; color: var(--muted); }
.dg-in { display: inline-flex; align-items: center; gap: 5px; }
.dg-in input, .dg-f select { height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); padding: 0 8px; }
.dg-in input { width: 92px; text-align: right; font: 600 15px var(--font-mono); font-variant-numeric: tabular-nums; }
.dg-f select { max-width: 260px; font-weight: 500; }
.dg-u { width: 26px; font-size: 12px; color: var(--muted); }
.dg-sat { grid-column: 1 / -1; font: 500 12.5px var(--font-mono); color: var(--accent); min-height: 0; }
.dg-sat:empty { display: none; }
.dg-refinfo { margin: 0; font-size: 12px; color: var(--muted); }
.dg-seg { font-size: 13px; }
.dg-checks { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; font-size: 12.5px; color: var(--ink-2); }
.dg-check { display: flex; gap: 6px; align-items: flex-start; }
.dg-check input { margin-top: 2px; accent-color: var(--accent); }
.dg-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.dg-right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.dg-out { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.dg-out h3, .dg-ph h3 { margin: 4px 0 0; font: 600 18px var(--font-display); }
.dg-summary { margin: 0; font-size: 15px; font-weight: 500; }
.dg-scroll { overflow-x: auto; }
.dg-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.dg-table th { text-align: left; font-weight: 500; color: var(--ink-2); padding: 6px 8px 6px 0; white-space: nowrap; }
.dg-table td { padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.dg-table tr:last-child td { border-bottom: 0; }
.dg-table td.v { font: 600 13px var(--font-mono); text-align: right; white-space: nowrap; }
.dg-table td.sub { color: var(--muted); font-size: 12px; }
.dg-warn { margin: 0; padding: 10px 12px 10px 28px; border-radius: 8px; background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); font-size: 13px; }
.dg-hyp { border: 1px solid var(--line); border-radius: 9px; padding: 0 12px; background: var(--panel); }
.dg-hyp[open] { padding-bottom: 12px; border-color: var(--line-strong); }
.dg-hyp summary { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; list-style: none; }
.dg-hyp summary::-webkit-details-marker { display: none; }
.dg-hyp summary::before { content: "▸"; color: var(--muted); }
.dg-hyp[open] summary::before { content: "▾"; }
.dg-hname { flex: 1; font-weight: 600; }
.dg-bar { width: 120px; height: 8px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.dg-bar i { display: block; height: 100%; background: var(--accent); }
.dg-hyp.normal .dg-bar i { background: var(--ok); }
.dg-pct { width: 42px; text-align: right; font: 600 13px var(--font-mono); color: var(--ink-2); }
.dg-hyp p { margin: 4px 0 8px; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
.dg-hyp h4 { margin: 10px 0 4px; font: 600 12px var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.dg-hyp ul, .dg-hyp ol, .dg-next ol { margin: 0; padding-left: 20px; font-size: 13px; line-height: 1.5; }
.dg-ev { list-style: none; padding-left: 0 !important; }
.dg-ev li::before { font-weight: 700; margin-right: 6px; }
.dg-ev li.ok::before { content: "✓"; color: var(--ok); }
.dg-ev li.no::before { content: "✗"; color: var(--bad); }
.dg-leak { margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--lp-mix) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--lp-mix) 30%, var(--line)); }
.dg-hyp .row { margin-top: 10px; }
.dg-next { padding: 10px 14px; border-radius: 8px; background: var(--panel-2); }
.dg-ph { padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.dg-ph canvas { width: 100%; height: 280px; display: block; }
.dg-pt { padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); display: flex; flex-direction: column; gap: 10px; }
.dg-pt summary { cursor: pointer; font-weight: 600; }
.dg-pttable { border-collapse: collapse; font: 500 12.5px var(--font-mono); margin-top: 8px; }
.dg-pttable th, .dg-pttable td { padding: 3px 12px; border-bottom: 1px solid var(--line); text-align: right; }
.dg-pttable th { font: 600 12px var(--font-ui); color: var(--muted); }

/* ---------------------------------------------------------------- práctica */
.practice-box { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
.pr-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pr-head strong { font: 600 18px var(--font-display); }
.pr-score { font: 500 12.5px var(--font-mono); color: var(--muted); }
.pr-easy { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); margin-left: auto; }
.pr-easy input { accent-color: var(--accent); }
.pr-q { margin: 0; font-weight: 600; }
.pr-opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.pr-opt { min-height: 40px; padding: 6px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); color: var(--ink); text-align: left; cursor: pointer; font-size: 13.5px; }
.pr-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.pr-opt.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, var(--panel)); font-weight: 600; }
.pr-opt.no { border-color: var(--bad); color: var(--muted); text-decoration: line-through; }
.pr-opt:disabled { cursor: default; }
.pr-bad { margin: 0; color: var(--bad); font-size: 13px; }
.pr-hints { margin: 0; padding-left: 20px; font-size: 13px; color: var(--ink-2); }
.pr-result { padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--ok) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--ok) 35%, var(--line)); font-size: 13px; }
.pr-result.gave { background: var(--panel-2); border-color: var(--line); }
.pr-result p { margin: 0 0 6px; }
.pr-title { font-weight: 700; font-size: 14px; }
.pr-sub { font-weight: 600; color: var(--ink-2); }

/* Panel de instalación (modo edición) */
.install { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px 24px; align-items: start; }

/* Propiedades / formularios */
.props-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px 16px; align-items: start; }
.props-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.props-head h3 { margin: 0; font: 600 20px var(--font-display); letter-spacing: 0.02em; }
.props-head .kind { color: var(--muted); font-size: 13px; }
.props-actions { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.field input[type="text"], .field input[type="number"], .field select, .field textarea { width: 100%; font-size: 14px; color: var(--ink); }
.field textarea { height: auto; min-height: 64px; padding: 6px 8px; resize: vertical; line-height: 1.4; }
.field.check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
.field .hint2 { font-size: 11px; color: var(--muted); }
.field input[type="range"] { width: 100%; accent-color: var(--accent); }
.field .rangeval { font: 500 12px var(--font-mono); color: var(--ink-2); }
.live-box {
  margin-top: 12px;
  padding: 8px 12px;
  border-radius: 6px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  font-size: 13px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.help { max-width: 72ch; color: var(--ink-2); }
.help h3 { margin: 0 0 6px; font: 600 20px var(--font-display); }
.help p { margin: 0 0 8px; }
.help kbd { font: 500 11px var(--font-mono); padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--panel-2); }
.help ul { margin: 0 0 8px; padding-left: 18px; }

.room-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 24px; align-items: start; }
.room-cols h4 { margin: 0 0 8px; font: 600 13px var(--font-display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn.door-btn { height: 38px; font-weight: 600; }
.btn.door-btn.open { background: color-mix(in srgb, var(--warn) 18%, var(--panel)); border-color: var(--warn); color: var(--ink); }
.note { font-size: 12px; color: var(--muted); margin: 0; }

/* Aviso flotante */
.snack {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 12px;
  max-width: calc(100vw - 32px);
  padding: 9px 12px 9px 16px;
  border-radius: 8px;
  background: var(--ink);
  color: var(--panel);
  box-shadow: var(--shadow);
  font-size: 13px;
  animation: toast-in 0.2s ease-out;
}
.snack .btn { background: transparent; color: var(--panel); border-color: color-mix(in srgb, var(--panel) 40%, transparent); }
.snack .btn:hover { background: color-mix(in srgb, var(--panel) 15%, transparent); color: var(--panel); }

/* Registro */
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 13px; }
.log li { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 5px 4px; border-bottom: 1px solid var(--line); }
.log time { font: 500 12px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.log li.cause span { color: var(--ink); }
.log li.cause { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.log li.result span { color: var(--ink-2); font-style: italic; }
.log li.info span { color: var(--ink-2); }
.log li.warn span { color: var(--warn); font-weight: 500; }
.log li.error span { color: var(--bad); font-weight: 600; }
.log .empty { color: var(--muted); display: block; border: 0; }

/* ---------------------------------------------------------- esquema SVG */
svg.elec { background: var(--canvas); cursor: default; }
svg.elec.tool-wire, svg.elec.tool-place { cursor: crosshair; }
.gridpt { fill: var(--grid); }
svg.elec.zoomed-out .gridpt { opacity: 0.4; }
.s { stroke: var(--sym); stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.s.thin { stroke-width: 1; }
.fillbg { fill: var(--sym-bg); }
.fillsym { fill: var(--sym); }
.s.dash { stroke-dasharray: 4 3; stroke-width: 1.2; }
.dot { fill: var(--sym); stroke: none; }
.t, .tn { font-family: var(--font-mono); font-size: 8.5px; fill: var(--muted); }
.tag { font: 600 13px var(--font-display); fill: var(--ink); letter-spacing: 0.02em; }
.tname { font: 400 9.5px var(--font-ui); fill: var(--muted); }
.mot { font: 600 16px var(--font-display); fill: var(--sym); }
.val { font: 500 9.5px var(--font-mono); fill: var(--accent); }
.sym-t { font: 600 10px var(--font-ui); fill: var(--sym); }
.label-t { font-family: var(--font-display); font-weight: 600; fill: var(--ink-2); letter-spacing: 0.08em; }
.ph-L1 { stroke: #8a5a2b; }
.ph-L2 { stroke: var(--sym); }
.ph-L3 { stroke: #7d8894; }
.ph-N { stroke: #2f6fd1; }
.term { fill: var(--canvas); stroke: var(--accent); stroke-width: 1.1; }
.hit { fill: transparent; stroke: none; }
.comp.clickable { cursor: pointer; }
.comp.clickable:hover .hit { fill: color-mix(in srgb, var(--accent) 9%, transparent); }
svg.elec:not(.sim) .comp { cursor: move; }
svg.elec.tool-wire .comp, svg.elec.tool-place .comp { cursor: crosshair; }
.selbox { fill: color-mix(in srgb, var(--select) 7%, transparent); stroke: var(--select); stroke-width: 1.2; stroke-dasharray: 4 3; }
.coil-on { fill: color-mix(in srgb, var(--live) 30%, var(--sym-bg)); stroke: var(--live); }
.motor-on { stroke: var(--ok); stroke-width: 2.2; }
.motor-hum { stroke: var(--bad); stroke-width: 2.2; animation: hum 0.12s linear infinite; }
.s.rot { stroke: var(--ok); stroke-width: 1.8; }
.spin { animation: spin 1.1s linear infinite; }
.spin.rev { animation-direction: reverse; }
.s.trip, .trip-t { stroke: var(--bad); fill: var(--bad); }
.s.trip { fill: none; }
.tn.trip-t, .val.trip-t { stroke: none; }
.trip-fill { fill: var(--bad); stroke: var(--bad); }
.defrost-fill { fill: color-mix(in srgb, var(--warn) 24%, var(--sym-bg)); }
.defrost-t { fill: var(--warn); }
.valve-open { fill: color-mix(in srgb, var(--live) 34%, var(--sym-bg)); }
.heat-on { fill: color-mix(in srgb, #ff7a2e 55%, var(--sym-bg)); stroke: var(--bad); filter: drop-shadow(0 0 4px rgba(255, 110, 40, var(--glow))); }
.heat-zig { stroke: #ffd2a8; stroke-width: 1.2; }
.lamp-off-verde { fill: color-mix(in srgb, #22c55e 12%, var(--sym-bg)); }
.lamp-off-rojo { fill: color-mix(in srgb, #ef4444 12%, var(--sym-bg)); }
.lamp-off-amarillo { fill: color-mix(in srgb, #f5b700 14%, var(--sym-bg)); }
.lamp-off-blanco { fill: var(--sym-bg); }
.lamp-off-azul { fill: color-mix(in srgb, #3b82f6 12%, var(--sym-bg)); }
.lamp-on { stroke: var(--sym); }
.lamp-on.lamp-verde { fill: #2fd873; filter: drop-shadow(0 0 6px rgba(47, 216, 115, var(--glow))); }
.lamp-on.lamp-rojo { fill: #ff4b3e; filter: drop-shadow(0 0 6px rgba(255, 75, 62, var(--glow))); }
.lamp-on.lamp-amarillo { fill: #ffc21a; filter: drop-shadow(0 0 6px rgba(255, 194, 26, var(--glow))); }
.lamp-on.lamp-blanco { fill: #fffbe6; filter: drop-shadow(0 0 7px rgba(255, 240, 180, var(--glow))); }
.lamp-on.lamp-azul { fill: #4b8dff; filter: drop-shadow(0 0 6px rgba(75, 141, 255, var(--glow))); }

.wire { fill: none; stroke: var(--sym); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.wire.live { stroke: var(--live); stroke-width: 2.3; }
.wire.neutral { stroke: var(--neutral); stroke-width: 2.3; }
.wire.short { stroke: var(--short); stroke-width: 3.2; animation: blink 0.5s steps(2) infinite; }
.wire.sel { stroke: var(--select); stroke-width: 3; }
.wire-hit { fill: none; stroke: transparent; stroke-width: 12; }
svg.elec:not(.sim) .w { cursor: pointer; }
.junction { fill: var(--sym); }
.draft { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
.snap { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.snap.hot { stroke: var(--accent); stroke-width: 2; fill: color-mix(in srgb, var(--accent) 20%, transparent); }
.ghost { opacity: 0.55; pointer-events: none; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes hum { 50% { transform: translateX(0.6px); } }
@keyframes blink { 50% { opacity: 0.35; } }

/* ---------------------------------------------------- circuito frigorífico */
svg.fridge { background: var(--canvas); }
.zone-room { fill: var(--room); stroke: var(--room-line); stroke-width: 1.5; }
.zone-unit { fill: var(--unit); stroke: var(--unit-line); stroke-width: 1.2; stroke-dasharray: 6 4; }
.zone-t { font: 600 14px var(--font-display); letter-spacing: 0.12em; fill: var(--muted); }
.zone-v { font: 500 13px var(--font-mono); fill: var(--ink-2); }
.big { font: 600 60px/1 var(--font-display); fill: var(--ink); font-variant-numeric: tabular-nums; }
.fl { font: 500 12px var(--font-ui); fill: var(--muted); letter-spacing: 0.04em; }
.fl2 { font: 400 11.5px var(--font-ui); fill: var(--ink-2); }
.part { font: 600 11px var(--font-display); letter-spacing: 0.1em; fill: var(--muted); }
.boxes rect { fill: color-mix(in srgb, #c89a5f 35%, var(--room)); stroke: color-mix(in srgb, #9a6a35 70%, var(--room)); }
.boxes line, .floor { stroke: color-mix(in srgb, #9a6a35 55%, var(--room)); }
.floor { stroke-width: 2; }

.pipe { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; transition: opacity 0.4s; }
.pipe.thin { stroke-width: 5; }
.pipe-shell { fill: none; stroke: var(--shell); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; opacity: 0.35; }
.pipe-shell.thin { stroke-width: 7.5; }
.pipe.hpg { stroke: var(--hp-gas); }
.pipe.hpl { stroke: var(--hp-liq); }
.pipe.lpm { stroke: var(--lp-mix); }
.pipe.lpg { stroke: var(--lp-gas); }
.st-hpg { stop-color: var(--hp-gas); }
.st-hpl { stop-color: var(--hp-liq); }
.st-lpm { stop-color: var(--lp-mix); }
.st-lpg { stop-color: var(--lp-gas); }
svg.fridge.no-flow .pipe { opacity: 0.55; }
.pipe.frosted { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 2px #cfe8ff); }
.flow { fill: none; stroke: rgba(255, 255, 255, 0.9); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 2 14; opacity: 0; transition: opacity 0.5s; }
.flow.thin { stroke-width: 2; stroke-dasharray: 2 12; }
.housing { fill: var(--housing); stroke: var(--line-strong); stroke-width: 1.2; }
.fins line { stroke: var(--line-strong); stroke-width: 0.8; opacity: 0.7; }
.fan-ring { fill: none; stroke: var(--line-strong); stroke-width: 2; }
.fan-ring.big { fill: color-mix(in srgb, var(--housing) 40%, transparent); }
.blades ellipse { fill: color-mix(in srgb, var(--ink-2) 55%, transparent); }
.blades.on { animation: spin 0.5s linear infinite; }
.blades.on ellipse { fill: color-mix(in srgb, var(--ink-2) 35%, transparent); }
.hub { fill: var(--ink-2); }
.heater path { fill: none; stroke: color-mix(in srgb, var(--muted) 60%, transparent); stroke-width: 1.4; stroke-linejoin: round; }
.heater.on path { stroke: #ff6a1f; stroke-width: 2.2; filter: drop-shadow(0 0 4px rgba(255, 100, 20, var(--glow))); }
.ice { fill: var(--ice); opacity: 0; pointer-events: none; }
#fv-ice-h { opacity: 0; pointer-events: none; }
.hatch { stroke: color-mix(in srgb, var(--lp-mix) 60%, #fff); stroke-width: 1.4; }
.dirt { fill: #8b6a3e; opacity: 0; pointer-events: none; }
.air path { fill: none; stroke: var(--lp-mix); stroke-width: 2; stroke-dasharray: 5 7; opacity: 0; transition: opacity 0.4s; }
.air.on path { opacity: 0.7; animation: airflow 0.9s linear infinite; }
.air.hot path { stroke: var(--hp-liq); }
.door-air path { fill: none; stroke: var(--hp-liq); stroke-width: 2.2; stroke-dasharray: 5 6; opacity: 0; }
.door-air path.cold { stroke: var(--lp-mix); }
.door-air.on path { opacity: 0.85; animation: airflow 0.8s linear infinite; }
@keyframes airflow { to { stroke-dashoffset: -24; } }
.door { cursor: pointer; }
.door-hit { fill: transparent; }
.door rect:not(.door-hit) { fill: color-mix(in srgb, var(--ink-2) 30%, var(--room)); stroke: var(--ink-2); stroke-width: 1.2; }
.door:hover rect:not(.door-hit) { stroke: var(--accent); }
.door:focus-visible { outline: none; }
.door:focus-visible rect:not(.door-hit) { stroke: var(--focus); stroke-width: 2; }
.door.open rect:not(.door-hit) { fill: color-mix(in srgb, var(--warn) 30%, var(--room)); }
.knob { fill: var(--ink-2); }
.door-gap { stroke: var(--room); stroke-width: 4; }
.valve path { fill: var(--sym-bg); stroke: var(--sym); stroke-width: 1.4; stroke-linejoin: round; }
.valve rect { fill: var(--housing); stroke: var(--sym); stroke-width: 1.2; }
.thinline { stroke: var(--sym); stroke-width: 1.2; }
.capillary { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 2; }
.bulb { fill: var(--housing); stroke: var(--sym); stroke-width: 1.2; }
.receiver { fill: var(--housing); stroke: var(--sym); stroke-width: 1.4; }
.recv-liq { fill: var(--hp-liq); opacity: 0.8; transition: y 0.4s, height 0.4s; }
.filter { fill: color-mix(in srgb, var(--shell) 45%, var(--housing)); stroke: var(--sym); stroke-width: 1.2; }
.glass-ring { fill: var(--housing); stroke: var(--sym); stroke-width: 1.3; }
.glass { fill: color-mix(in srgb, var(--hp-liq) 70%, #fff); transition: fill 0.3s; }
.glass.empty { fill: color-mix(in srgb, var(--hp-liq) 25%, #fff); }
.bubbles circle { fill: #fff; stroke: color-mix(in srgb, var(--hp-liq) 60%, #000); stroke-width: 0.5; opacity: 0; }
.bubbles.on circle { opacity: 1; animation: bubble 0.7s linear infinite; }
.bubbles.on circle:nth-child(2) { animation-delay: -0.2s; }
.bubbles.on circle:nth-child(3) { animation-delay: -0.45s; }
.bubbles.on circle:nth-child(4) { animation-delay: -0.6s; }
@keyframes bubble { from { transform: translateX(-5px); } to { transform: translateX(5px); } }
.sol-body { fill: var(--sym-bg); stroke: var(--sym); stroke-width: 1.3; stroke-linejoin: round; }
.sol-coil { fill: var(--housing); stroke: var(--sym); stroke-width: 1.2; }
.solenoid.open .sol-coil { fill: color-mix(in srgb, var(--live) 40%, var(--housing)); stroke: var(--live); }
.solenoid.open .sol-body { fill: color-mix(in srgb, var(--hp-liq) 45%, var(--sym-bg)); }
.compressor { fill: color-mix(in srgb, var(--shell) 25%, var(--housing)); stroke: var(--sym); stroke-width: 1.5; }
.compressor.on { fill: color-mix(in srgb, var(--ok) 18%, var(--housing)); animation: vibrate 0.09s linear infinite; }
.compressor.locked { fill: color-mix(in srgb, var(--bad) 25%, var(--housing)); animation: vibrate 0.06s linear infinite; }
@keyframes vibrate { 50% { transform: translate(0.5px, -0.4px); } }
.comp-base { fill: var(--ink-2); }
.comp-motor { fill: var(--sym-bg); stroke: var(--sym); stroke-width: 1.2; }
.comp-spin path { fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; opacity: 0.3; }
.comp-spin.on { animation: spin 0.8s linear infinite; }
.comp-spin.on path { stroke: var(--ok); opacity: 1; }
.pstat rect { fill: var(--panel); stroke: var(--sym); stroke-width: 1.1; }
.pstat text { font: 600 11px var(--font-display); letter-spacing: 0.08em; fill: var(--ink-2); }
.pstat.trip rect { fill: var(--bad); stroke: var(--bad); }
.pstat.trip text { fill: #fff; }
.hose { fill: none; stroke-width: 2; stroke-dasharray: 1 3; stroke-linecap: round; }
.hose.lp { stroke: var(--lp-gas); }
.hose.hp { stroke: var(--hp-gas); }
.g-face { fill: var(--panel); }
.g-rim { fill: none; stroke-width: 4; }
.gauge.lp .g-rim { stroke: var(--lp-gas); }
.gauge.hp .g-rim { stroke: var(--hp-gas); }
.tk { stroke: var(--ink-2); stroke-width: 1.3; }
.tk.minor { stroke-width: 0.7; }
.tkl { font: 500 8.5px var(--font-mono); fill: var(--ink-2); }
.tks { font: 500 6.8px var(--font-mono); fill: var(--accent); }
.g-name { font: 600 11px var(--font-display); letter-spacing: 0.12em; fill: var(--ink); }
.g-ref { font: 400 7.5px var(--font-ui); fill: var(--muted); }
.needle line { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.needle circle { fill: var(--ink); }
.gauge .needle { transition: transform 0.25s ease-out; }
.g-panel { fill: var(--panel-2); stroke: var(--line); }
.g-val { font: 600 13px var(--font-mono); fill: var(--ink); font-variant-numeric: tabular-nums; }
.g-sat { font: 500 10px var(--font-mono); fill: var(--accent); }
.ftag rect { fill: color-mix(in srgb, var(--panel) 92%, transparent); stroke: var(--line); }
.ftag text { font: 500 11px var(--font-mono); fill: var(--ink); font-variant-numeric: tabular-nums; }
.legend text { font: 400 10.5px var(--font-ui); fill: var(--muted); dominant-baseline: middle; }
.lg { stroke-width: 5; stroke-linecap: round; }
.lg.hpg { stroke: var(--hp-gas); }
.lg.hpl { stroke: var(--hp-liq); }
.lg.lpm { stroke: var(--lp-mix); }
.lg.lpg { stroke: var(--lp-gas); }

@media (prefers-reduced-motion: reduce) {
  .spin, .blades.on, .comp-spin.on, .compressor.on, .compressor.locked, .air.on path, .door-air.on path, .bubbles.on circle, .motor-hum, .wire.short { animation: none !important; }
}


/* Piezas del circuito frigorífico que se pueden tocar */
svg.fridge .part-g { cursor: pointer; }
svg.fridge .part-g:focus { outline: none; }
svg.fridge .part-g:not([data-part="room"]):not([data-part="unit"]):hover,
svg.fridge .part-g:not([data-part="room"]):not([data-part="unit"]):focus-visible { filter: drop-shadow(0 0 1.6px var(--accent)) drop-shadow(0 0 4px color-mix(in srgb, var(--accent) 45%, transparent)); }
svg.fridge .part-g.sel:not([data-part="room"]):not([data-part="unit"]) { filter: drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 6px var(--accent)); }
svg.fridge [data-part="room"]:hover .zone-room, svg.fridge [data-part="room"].sel .zone-room,
svg.fridge [data-part="unit"]:hover .zone-unit, svg.fridge [data-part="unit"].sel .zone-unit { stroke: var(--accent); stroke-width: 2.2; }
svg.fridge .ftag { cursor: pointer; }
svg.fridge .ftag:hover rect { stroke: var(--accent); }
.hitbox { fill: transparent; }
.pipe-hit { fill: none; stroke: transparent; stroke-width: 18; stroke-linecap: round; }
.refchip { cursor: pointer; }
.refchip rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; }
.refchip text { font: 600 13px var(--font-display); letter-spacing: 0.04em; fill: var(--accent); }
.refchip:hover rect { fill: var(--accent); }
.refchip:hover text { fill: var(--accent-ink); }
.comp.hl .hit { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 4 3; }
svg.elec.sim .comp { cursor: pointer; }

/* ---------------------------------------------------------- pantallas pequeñas */
@media (max-width: 1180px) {
  .lbl { display: none; }
  .quick { margin-left: 0; }
  .pane-hint { display: none; }
}

@media (max-width: 860px) {
  body { overflow: auto; }
  .app, .app[data-mode] { display: block; height: auto; }
  .topbar { gap: 6px 8px; padding: 6px 10px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); position: sticky; top: 0; }
  .brand-name { display: none; }
  .modes { order: 3; width: 100%; overflow-x: auto; }
  .modes button { flex: 1; padding: 0 6px; font-size: 13px; }
  .select-btn select { max-width: 160px; }
  .simbar { padding: 6px 10px; gap: 6px; flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
  .simbar .sb-group { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; min-width: 0; margin-left: 0; }
  .simbar .sb-group::-webkit-scrollbar { display: none; }
  .simbar .sb-group > * { flex: none; }
  .readings { flex-wrap: wrap; padding: 8px 10px; }
  .rd { flex: 1 1 150px; }
  .stage { flex-direction: column; }
  .app[data-mode] .pane-fridge, .app[data-mode] .pane-elec { flex: none; }
  .splitter { display: none; }
  .pane-fridge .canvas-wrap { flex: none; aspect-ratio: 1000 / 640; height: auto; }
  .pane-elec .canvas-wrap { flex: none; height: 64vh; }
  .app[data-mode="edit"] .pane-elec .canvas-wrap { height: calc(100vh - 170px); }
  .app[data-mode="sim"] .pane-elec, .app[data-mode="practice"] .pane-elec { border-left: 0; border-top: 1px solid var(--line); }
  .hint { display: none; }
  .dock { height: 62vh; }
  .app.dock-collapsed .dock { height: 42px; }
  .palette {
    position: fixed;
    z-index: 20;
    left: 0;
    top: 0;
    bottom: 0;
    width: min(300px, 86vw);
    box-shadow: var(--shadow);
    transform: translateX(-105%);
    transition: transform 0.2s;
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
  }
  .app.pal-open .palette { transform: none; }
  #btn-parts-mobile { display: inline-flex; }
  .diagpage { padding: 14px 12px 40px; }
  .dg-cols { grid-template-columns: minmax(0, 1fr); }
  .dg-checks { grid-template-columns: 1fr; }
  .dg-bar { width: 70px; }
}
</style>
</head>

<div id="app" class="app" data-mode="sim">

      <button type="button" data-mode="diag" aria-pressed="false">Diagnosticar</button>

<script>
(() => {
'use strict';
const __mods = {};
// ---- js/elec/components.js
__mods["js/elec/components.js"] = (() => {
// Biblioteca de componentes eléctricos (símbolos IEC, estilo CADe SIMU).
//
// Cada tipo define:
//   label, terms: [{n, x, y}] en unidades de rejilla (origen = primer borne),
//   box: [x0, y0, x1, y1] caja de selección (rejilla),
//   defaults: propiedades iniciales, props: campos editables,
//   links(ctx): pares de bornes conectados eléctricamente ahora mismo,
//   loads: cargas [{terms, kind}] (bobinas, lámparas, motores...),
//   draw(ctx): SVG en coordenadas locales (px),
//   master: tipo de dispositivo que crea (bobina de relé, temporizador...),
//   slaveOf: tipo de dispositivo del que depende (contactos por etiqueta).

const G = 20;

// ---------------------------------------------------------------- helpers SVG
const f = (n) => Math.round(n * 10) / 10;
const line = (x1, y1, x2, y2, cls = 's') => `<line class="${cls}" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"/>`;
const path = (d, cls = 's') => `<path class="${cls}" d="${d}"/>`;
const circle = (cx, cy, r, cls = 's') => `<circle class="${cls}" cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}"/>`;
const rect = (x, y, w, h, cls = 's') => `<rect class="${cls}" x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}"/>`;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/** Texto que se mantiene horizontal aunque el símbolo esté girado. */
function text(ctx, x, y, s, cls = 't', anchor = 'middle') {
  if (s === undefined || s === null || s === '') return '';
  const rot = ctx.comp.rot || 0;
  let a = anchor;
  // Al girar 180° el anclaje izquierdo/derecho se invierte visualmente.
  if (rot === 180 && anchor !== 'middle') a = anchor === 'end' ? 'start' : 'end';
  const tr = rot ? ` transform="rotate(${-rot} ${f(x)} ${f(y)})"` : '';
  return `<text class="${cls}" x="${f(x)}" y="${f(y)}" text-anchor="${a}" dominant-baseline="middle"${tr}>${esc(s)}</text>`;
}

function tagLabel(ctx, x = -16, y = 30) {
  const { props } = ctx.comp;
  let out = text(ctx, x, props.name ? y - 6 : y, props.tag, 'tag', 'end');
  if (props.name) out += text(ctx, x, y + 7, props.name, 'tname', 'end');
  return out;
}

const termNums = (ctx, a, b, x = 5) => text(ctx, x, 7, a, 'tn', 'start') + text(ctx, x, 54, b, 'tn', 'start');

// --------------------------------------------------------- piezas de símbolos
function contactNO(closed, cls = '', x = 0) {
  return (
    line(x, 0, x, 20) +
    line(x, 40, x, 60) +
    (closed ? line(x, 40, x - 1.5, 20, `s blade ${cls}`) : line(x, 40, x - 11, 21, `s blade ${cls}`))
  );
}

function contactNC(closed, cls = '', x = 0) {
  return (
    line(x, 0, x, 20) +
    line(x, 20, x - 12, 20) +
    line(x, 40, x, 60) +
    (closed ? line(x, 40, x - 13, 17, `s blade ${cls}`) : line(x, 40, x - 4, 22, `s blade ${cls}`))
  );
}

/** Conmutado: común arriba, NC recto hacia abajo, NA desplazado 2 cuadros. */
function changeover(actuated) {
  return (
    line(0, 0, 0, 18) +
    line(0, 44, 0, 60) +
    line(0, 44, -12, 44) +
    line(14, 44, 14, 50) +
    line(14, 50, 40, 50) +
    line(40, 50, 40, 60) +
    (actuated ? line(0, 18, 15, 42, 's blade') : line(0, 18, -11, 45, 's blade')) +
    circle(0, 18, 1.8, 'dot')
  );
}

function actuatorLine(x1, y, x2 = -26) {
  return line(x1, y, x2, y, 's dash');
}

const act = {
  push: (x = -26, y = 30) => path(`M${x + 4},${y - 6} H${x} V${y + 6} H${x + 4}`),
  pull: (x = -26, y = 30) => path(`M${x - 4},${y - 6} H${x} V${y + 6} H${x - 4}`),
  toggle: (x = -26, y = 30) => path(`M${x},${y - 6} V${y + 6} M${x},${y - 6} L${x - 5},${y - 11}`),
  estop: (x = -26, y = 30) => path(`M${x},${y} m0,-9 a9,9 0 0,0 0,18 z`, 's fillsym'),
  thermal: (x = -26, y = 30) => path(`M${x},${y - 5} h-5 v10 h-5`),
  position: (x = -26, y = 30) => path(`M${x},${y - 6} L${x - 7},${y} L${x},${y + 6}`),
  temp: (x = -26, y = 30) => rect(x - 14, y - 7, 14, 14) + `<text class="t sym-t" x="${x - 7}" y="${y + 0.5}" text-anchor="middle" dominant-baseline="middle">θ</text>`,
  press: (x = -26, y = 30) => rect(x - 14, y - 7, 14, 14) + `<text class="t sym-t" x="${x - 7}" y="${y + 0.5}" text-anchor="middle" dominant-baseline="middle">P</text>`,
  clock: (x = -26, y = 30) => circle(x - 7, y, 7) + path(`M${x - 7},${y} V${y - 5} M${x - 7},${y} H${x - 3}`),
  timer: (x = -26, y = 30, tof = false) =>
    tof ? path(`M${x + 2},${y - 6} a6,6 0 0,0 0,12`) + line(x + 2, y - 6, x + 2, y + 6) : path(`M${x - 4},${y - 6} a6,6 0 0,1 0,12`) + line(x - 4, y - 6, x - 4, y + 6),
};

// ------------------------------------------------------------- dispositivos
const devActive = (ctx) => !!(ctx.dev && ctx.dev.active);

// --------------------------------------------------------------------- tipos
const FUNCS = {
  ninguna: 'Ninguna',
  compresor: 'Compresor',
  vent_evap: 'Ventilador evaporador',
  vent_cond: 'Ventilador condensador',
  desescarche: 'Resistencia desescarche',
  solenoide: 'Válvula solenoide (línea de líquido)',
  luz: 'Luz de la cámara',
};

const PROBES = { camara: 'Aire cámara', evaporador: 'Batería evaporador', producto: 'Género', exterior: 'Ambiente exterior' };

const nameProp = { key: 'name', label: 'Descripción', type: 'text' };
const tagProp = { key: 'tag', label: 'Etiqueta', type: 'text' };

function twoTermBox() {
  return [-1.5, 0, 1, 3];
}

const TYPES = {
  // ============================================================ alimentación
  supply3: {
    label: 'Red trifásica 3F+N',
    terms: [
      { n: 'L1', x: 0, y: 0, phase: 'L1' },
      { n: 'L2', x: 2, y: 0, phase: 'L2' },
      { n: 'L3', x: 4, y: 0, phase: 'L3' },
      { n: 'N', x: 6, y: 0, phase: 'N' },
    ],
    box: [-0.6, -2.4, 6.6, 0],
    defaults: { name: '400/230 V 50 Hz' },
    props: [nameProp],
    draw(ctx) {
      let s = rect(-12, -46, 144, 26, 's fillbg');
      s += text(ctx, 60, -39, ctx.comp.props.name || '', 'tname');
      const names = ['L1', 'L2', 'L3', 'N'];
      names.forEach((n, i) => {
        s += line(i * 40, -20, i * 40, 0, `s ph-${n}`);
        s += text(ctx, i * 40, -27, n, 'tag');
      });
      return s;
    },
  },
  supply1: {
    label: 'Red monofásica L+N',
    terms: [
      { n: 'L', x: 0, y: 0, phase: 'L1' },
      { n: 'N', x: 2, y: 0, phase: 'N' },
    ],
    box: [-0.6, -2.4, 2.6, 0],
    defaults: { name: '230 V' },
    props: [nameProp],
    draw(ctx) {
      let s = rect(-12, -46, 64, 26, 's fillbg');
      s += text(ctx, 20, -39, ctx.comp.props.name || '', 'tname');
      s += line(0, -20, 0, 0, 's ph-L1') + line(40, -20, 40, 0, 's ph-N');
      s += text(ctx, 0, -27, 'L', 'tag') + text(ctx, 40, -27, 'N', 'tag');
      return s;
    },
  },
  bus: {
    label: 'Borne de alimentación',
    terms: [{ n: 'P', x: 0, y: 0, phaseProp: 'phase' }],
    box: [-0.6, -1.2, 0.6, 0],
    defaults: { phase: 'L1' },
    props: [{ key: 'phase', label: 'Fase', type: 'select', options: { L1: 'L1', L2: 'L2', L3: 'L3', N: 'N' } }],
    draw(ctx) {
      const ph = ctx.comp.props.phase;
      return line(0, -6, 0, 0) + circle(0, -14, 9, `s fillbg ph-${ph}`) + text(ctx, 0, -13.5, ph, 'tag');
    },
  },

  // ============================================================ protecciones
  mcb1: mcb(1),
  mcb2: mcb(2),
  mcb3: mcb(3),
  mcb4: mcb(4),
  fuse: {
    label: 'Fusible',
    tagPrefix: 'F',
    terms: [{ n: '1', x: 0, y: 0 }, { n: '2', x: 0, y: 3 }],
    box: twoTermBox(),
    defaults: { In: 10 },
    props: [tagProp, nameProp, { key: 'In', label: 'Calibre (A)', type: 'number', min: 0.5, step: 0.5 }],
    protective: true,
    initState: () => ({ blown: false }),
    links: (ctx) => (ctx.st.blown ? [] : [['1', '2']]),
    draw(ctx) {
      const b = ctx.st && ctx.st.blown;
      let s = rect(-6, 12, 12, 36, 's fillbg');
      s += b ? line(0, 0, 0, 24) + line(0, 36, 0, 60) + path('M-5,26 L5,34 M5,26 L-5,34', 's trip') : line(0, 0, 0, 60);
      return s + tagLabel(ctx, -12) + termNums(ctx, '1', '2');
    },
    click(sim, c, st) {
      if (st.blown) {
        st.blown = false;
        sim.log('info', `${c.props.tag}: fusible sustituido.`);
      } else {
        st.blown = true;
        sim.log('warn', `${c.props.tag}: fusible retirado (circuito abierto).`);
      }
      return true;
    },
  },
  thermal3: {
    label: 'Relé térmico (3 polos)',
    tagPrefix: 'F',
    master: 'thermal',
    terms: [
      { n: '1', x: 0, y: 0 }, { n: '2', x: 0, y: 3 },
      { n: '3', x: 2, y: 0 }, { n: '4', x: 2, y: 3 },
      { n: '5', x: 4, y: 0 }, { n: '6', x: 4, y: 3 },
    ],
    box: [-1.2, 0, 5.8, 3],
    defaults: { Iset: 4, reset: 'manual' },
    props: [
      tagProp,
      nameProp,
      { key: 'Iset', label: 'Regulación (A)', type: 'number', min: 0.1, step: 0.1 },
      { key: 'reset', label: 'Rearme', type: 'select', options: { manual: 'Manual', auto: 'Automático' } },
    ],
    // Los elementos térmicos siempre conducen; lo que abre es el contacto 95-96.
    links: () => [['1', '2'], ['3', '4'], ['5', '6']],
    draw(ctx) {
      const trip = devActive(ctx);
      let s = '';
      for (const x of [0, 40, 80]) {
        s += line(x, 0, x, 16) + rect(x - 7, 16, 14, 28, 's fillbg') + path(`M${x},16 v8 h5 v12 h-5 v8`) + line(x, 44, x, 60);
      }
      s += line(7, 30, 33, 30, 's dash') + line(47, 30, 73, 30, 's dash') + line(87, 30, 104, 30, 's dash');
      s += rect(104, 23, 14, 14, trip ? 's trip-fill' : 's fillbg');
      s += text(ctx, 111, 30.5, 'R', 'tn');
      if (ctx.dev) s += text(ctx, 111, 46, `${fmt1(ctx.dev.current)} A`, trip ? 'tn trip-t' : 'tn');
      return s + tagLabel(ctx, -12);
    },
    click(sim, c) {
      const d = sim.devices.get(c.props.tag);
      return d ? sim.resetThermal(d) : false;
    },
  },
  th_nc: {
    label: 'Contacto térmico NC 95-96',
    tagPrefix: 'F',
    slaveOf: 'thermal',
    terms: [{ n: '95', x: 0, y: 0 }, { n: '96', x: 0, y: 3 }],
    box: twoTermBox(),
    props: [tagProp],
    links: (ctx) => (devActive(ctx) ? [] : [['95', '96']]),
    draw(ctx) {
      const on = devActive(ctx);
      return contactNC(!on) + actuatorLine(on ? -2 : -6, 30) + act.thermal() + text(ctx, -46, 30, ctx.comp.props.tag, 'tag', 'end') + termNums(ctx, '95', '96');
    },
    click(sim, c) {
      const d = sim.devices.get(c.props.tag);
      return d ? sim.resetThermal(d) : false;
    },
  },
  th_no: {
    label: 'Contacto térmico NA 97-98',
    tagPrefix: 'F',
    slaveOf: 'thermal',
    terms: [{ n: '97', x: 0, y: 0 }, { n: '98', x: 0, y: 3 }],
    box: twoTermBox(),
    props: [tagProp],
    links: (ctx) => (devActive(ctx) ? [['97', '98']] : []),
    draw(ctx) {
      const on = devActive(ctx);
      return contactNO(on) + actuatorLine(on ? -1 : -6, 30) + act.thermal() + text(ctx, -46, 30, ctx.comp.props.tag, 'tag', 'end') + termNums(ctx, '97', '98');
    },
    click(sim, c) {
      const d = sim.devices.get(c.props.tag);
      return d ? sim.resetThermal(d) : false;
    },
  },

  // ================================================================== mando
  pb_no: {
    label: 'Pulsador NA (marcha)',
    tagPrefix: 'S',
    terms: [{ n: '3', x: 0, y: 0 }, { n: '4', x: 0, y: 3 }],
    box: [-2, 0, 1, 3],
    defaults: { name: 'Marcha' },
    props: [tagProp, nameProp],
    momentary: true,
    initState: () => ({ pressed: false }),
    links: (ctx) => (ctx.st.pressed ? [['3', '4']] : []),
    draw(ctx) {
      const p = ctx.st && ctx.st.pressed;
      return contactNO(p) + actuatorLine(p ? -1 : -6, 30) + act.push() + tagLabel(ctx, -32) + termNums(ctx, '3', '4');
    },
  },
  pb_nc: {
    label: 'Pulsador NC (paro)',
    tagPrefix: 'S',
    terms: [{ n: '1', x: 0, y: 0 }, { n: '2', x: 0, y: 3 }],
    box: [-2, 0, 1, 3],
    defaults: { name: 'Paro' },
    props: [tagProp, nameProp],
    momentary: true,
    initState: () => ({ pressed: false }),
    links: (ctx) => (ctx.st.pressed ? [] : [['1', '2']]),
    draw(ctx) {
      const p = ctx.st && ctx.st.pressed;
      return contactNC(!p) + actuatorLine(p ? -2 : -6, 30) + act.push() + tagLabel(ctx, -32) + termNums(ctx, '1', '2');
    },
  },
  estop: {
    label: 'Seta de emergencia',
    tagPrefix: 'S',
    terms: [{ n: '1', x: 0, y: 0 }, { n: '2', x: 0, y: 3 }],
    box: [-2.2, 0, 1, 3],
    defaults: { name: 'Emergencia' },
    props: [tagProp, nameProp],
    initState: () => ({ latched: false }),
    links: (ctx) => (ctx.st.latched ? [] : [['1', '2']]),

// diferencia entre ambos es el deslizamiento ("glide").
//
// El modelo de simulación trabaja con la temperatura MEDIA entre burbuja y

// un analizador digital.

  R290: 'R290 (propano)',
  R600a: 'R600a (isobutano)',

  R1234ze: 'R1234ze(E)',

  const lnPb = d.Pb.map(Math.log);

    t0: d.T[0],
    step: d.T[1] - d.T[0],
    count: n,

    lnPd,

class Panels {
  constructor(app) {
    this.app = app;
    this.props = document.getElementById('panel-props');
    this.logEl = document.getElementById('log');
    this.logOnly = document.getElementById('log-only-explain');
    this.entries = [];
    this.logOnly.addEventListener('change', () => this.renderLog());
  }

  // ---------------------------------------------------------- propiedades
  renderProps() {
    const { app } = this;
    const sel = app.editor.sel;
    const el = this.props;
    el.innerHTML = '';
    this.liveBox = null;
    if (!sel) {
      el.append(this._projectInfo());
      return;
    }
    if (sel.kind === 'wire') {
      el.append(
        h('div', { class: 'props-head' },
          h('h3', {}, 'Cable'),
          h('span', { class: 'kind' }, app.sim ? 'En simulación: rojo = fase, azul = neutro.' : 'Selecciona y pulsa Supr para borrarlo.'),
          !app.sim && h('div', { class: 'props-actions' }, h('button', { class: 'btn small danger', onclick: () => app.editor.deleteSelection() }, 'Borrar cable')),
        ),
      );
      return;
    }
    const c = app.editor.selected();
    if (!c) return;
    const T = TYPES[c.type];
    const head = h('div', { class: 'props-head' },
      h('h3', {}, c.props.tag ? `${c.props.tag}${c.props.name ? ' · ' + c.props.name : ''}` : T.label),
      h('span', { class: 'kind' }, T.label),
      !app.sim && h('div', { class: 'props-actions' },
        h('button', { class: 'btn small', onclick: () => app.editor.rotateSelection() }, 'Girar'),
        h('button', { class: 'btn small', onclick: () => app.editor.duplicateSelection() }, 'Duplicar'),
        h('button', { class: 'btn small danger', onclick: () => app.editor.deleteSelection() }, 'Borrar'),
      ),
    );
    const grid = h('div', { class: 'props-grid' });
    for (const def of T.props || []) grid.append(this._field(c, def));
    el.append(head, grid);
    if (DESCRIPTIONS[c.type]) el.append(h('p', { class: 'note', style: 'margin-top:10px;max-width:80ch' }, DESCRIPTIONS[c.type]));
    if (app.sim) {
      this.liveBox = h('div', { class: 'live-box' });
      el.append(this.liveBox);
      this.updatePropsLive();
    }
  }

  _field(c, def) {
    const { app } = this;
    const id = `prop-${def.key}`;
    const disabled = app.sim && !def.live && def.key !== 'name';
    const val = c.props[def.key];
    const set = (v) => app.setProp(c.id, def.key, v);
    let input;
    if (def.type === 'select') {
      input = h('select', { id, disabled }, Object.entries(def.options).map(([k, l]) => h('option', { value: k, selected: String(val) === k }, l)));
      input.addEventListener('change', () => set(input.value));
    } else if (def.type === 'bool') {
      input = h('input', { type: 'checkbox', id, disabled, checked: !!val });
      input.addEventListener('change', () => set(input.checked));
      return h('label', { class: 'field check', for: id }, input, def.label);
    } else if (def.type === 'number') {
      input = h('input', { type: 'number', id, disabled, value: val, step: def.step ?? 'any', min: def.min, max: def.max, inputmode: 'decimal' });
      input.addEventListener('change', () => {
        const v = parseFloat(String(input.value).replace(',', '.'));
        if (Number.isFinite(v)) set(v);
      });
    } else {
      input = h('input', { type: 'text', id, disabled, value: val ?? '' });
      input.addEventListener('change', () => set(input.value.trim()));
    }
    return h('label', { class: 'field', for: id }, def.label, input, def.hint && h('span', { class: 'hint2' }, def.hint));
  }

  _projectInfo() {
    const { app } = this;
    const p = app.project;
    const name = h('input', { type: 'text', id: 'proj-name', value: p.name || '' });
    name.addEventListener('change', () => {
      p.name = name.value;
      app.saveSoon();
    });
    const desc = h('textarea', { id: 'proj-desc', rows: 3 }, p.description || '');
    desc.addEventListener('change', () => {
      p.description = desc.value;
      app.saveSoon();
    });
    return h('div', { class: 'room-cols' },
      h('div', { class: 'stack' },
        h('label', { class: 'field', for: 'proj-name' }, 'Nombre del esquema', name),
        h('label', { class: 'field', for: 'proj-desc' }, 'Descripción', desc),
      ),
      h('div', { class: 'help', html: HELP_HTML }),
    );
  }

  updatePropsLive() {
    const { app } = this;
    if (!this.liveBox || !app.sim) return;
    const c = app.editor.selected();
    if (!c || !app.sim.elec.compById.has(c.id)) return;
    this.liveBox.textContent = liveText(app.sim, c);
  }

  // ------------------------------------------- instalación y averías
  /**
   * Ajustes de la instalación frigorífica y averías. Sirve para la pestaña
   * del simulador (cambios en vivo) y para la del editor (valores de partida).
   */
  renderRoom(el, { edit = false } = {}) {
    const { app } = this;
    el.innerHTML = '';
    const P = () => app.params();
    const F = () => app.faults();
    const sync = [];
    const bind = (ctl, get) => {
      sync.push({ ctl, get, last: get() });
      return ctl;
    };
    const th = app.thermostat();
    const pct = (v) => Math.round(v * 100);

    const col1 = h('div', { class: 'stack' }, h('h4', {}, 'Cámara'));
    if (!edit) {
      col1.append(
        bind(toggle('Puerta abierta', app.out() && app.out().door, (v) => {
          if (app.out() && v !== app.out().door) app.toggleDoor();
        }), () => !!(app.out() && app.out().door)),
        h('div', { class: 'row' }, h('button', { class: 'btn small', type: 'button', onclick: () => app.addProductLoad() }, 'Meter género caliente')),
      );
    }
    if (th) {
      col1.append(
        bind(stepper(`Consigna ${th.props.tag} (para a)`, +th.props.sp, { step: 0.5, min: -35, max: 20, unit: '°C' }, (v) => app.setThermostat('sp', v)), () => +th.props.sp),
        bind(stepper('Diferencial', +th.props.diff, { step: 0.5, min: 0.5, max: 10, unit: 'K' }, (v) => app.setThermostat('diff', v)), () => +th.props.diff),
      );
    }
    col1.append(
      bind(stepper('Temperatura exterior', P().Tamb, { step: 1, min: -10, max: 46, unit: '°C' }, (v) => app.setRefrig('Tamb', v)), () => P().Tamb),
      bind(stepper(edit ? 'Temperatura inicial de la cámara' : 'Cámara al reiniciar', P().TroomInit, { step: 1, min: -30, max: 35, unit: '°C' }, (v) => app.setRefrig('TroomInit', v)), () => P().TroomInit),
      bind(seg('Aislamiento', { 0.025: 'Bueno', 0.04: 'Normal', 0.07: 'Malo' }, String(P().roomUA), (v) => app.setRefrig('roomUA', +v)), () => String(P().roomUA)),
    );

    const col2 = h('div', { class: 'stack' }, h('h4', {}, 'Instalación'));
    if (edit) {
      col2.append(toggle('Circuito frigorífico asociado', P().enabled !== false, (v) => app.setRefrigEnabled(v)),
        h('p', { class: 'note' }, 'Desactívalo para simular solo el esquema eléctrico, como en CADe SIMU.'));
    }
    const refOpts = Object.fromEntries(SIM_REFRIGERANT_IDS.map((id) => [id, REFRIGERANTS[id].label]));
    col2.append(
      bind(select('Refrigerante', refOpts, P().refrigerant, (v) => app.setRefrig('refrigerant', v)), () => P().refrigerant),
      bind(stepper('Potencia frigorífica (−10/+40 °C)', P().capacityKW, { step: 0.1, min: 0.2, max: 50, unit: 'kW' }, (v) => app.setRefrig('capacityKW', v)), () => P().capacityKW),
      bind(seg('Expansión', { txv: 'VET + recipiente', capilar: 'Tubo capilar' }, P().expansion, (v) => app.setRefrig('expansion', v)), () => P().expansion),
      bind(stepper('Recalentamiento de la VET', P().shSet, { step: 0.5, min: 2, max: 15, unit: 'K' }, (v) => app.setRefrig('shSet', v)), () => P().shSet),
      bind(stepper('Resistencia de desescarche', P().heaterKW, { step: 0.1, min: 0.1, max: 20, unit: 'kW' }, (v) => app.setRefrig('heaterKW', v)), () => P().heaterKW),
    );

    const cols = [col1, col2];
    if (!app.practiceHideFaults) {
      const chk = (key, label) => bind(toggle(label, F()[key], (v) => app.setFault(key, v), { danger: true }), () => !!F()[key]);
      const col3 = h('div', { class: 'stack' }, h('h4', {}, edit ? 'Averías de partida' : 'Averías'),
        bind(slider('Carga de refrigerante', Math.round(F().chargePct), { min: 20, max: 140, step: 1, unit: '%' }, (v) => app.setFault('chargePct', v)), () => Math.round(F().chargePct)),
        bind(seg('Fuga', { 0: 'Sin fuga', 5: 'Lenta', 20: 'Media', 60: 'Rápida' }, String(F().leakRate || 0), (v) => app.setFault('leakRate', +v)), () => String(F().leakRate || 0)),
        bind(slider('Condensador sucio', pct(F().condDirt), { min: 0, max: 100, step: 5, unit: '%' }, (v) => app.setFault('condDirt', v / 100)), () => pct(F().condDirt)),
        bind(slider('Filtro deshidratador obstruido', pct(F().filterClog), { min: 0, max: 100, step: 5, unit: '%' }, (v) => app.setFault('filterClog', v / 100)), () => pct(F().filterClog)),
