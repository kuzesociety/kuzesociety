<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FrigoSIMU</title>
<meta name="description" content="Simulador de instalaciones frigoríficas con su esquema eléctrico: toca cualquier pieza y mira qué pasa con presiones y temperaturas. Incluye diagnóstico de averías a partir de lecturas reales.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23ad5724'/%3E%3Cpath d='M12 3.5v17M4.6 7.75l14.8 8.5M4.6 16.25l14.8-8.5' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></symbol>
  <symbol id="i-ffwd" viewBox="0 0 24 24"><path d="M4 6v12l8-6zM12 6v12l8-6z" fill="currentColor"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.05-4.95M5 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4.5 12H15a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5M19.5 12H9a5 5 0 0 0 0 10h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-cursor" viewBox="0 0 24 24"><path d="M6 3.5 18.5 12l-5.6 1.3 3.4 6.2-2.3 1.2-3.4-6.2L6 18.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-wire" viewBox="0 0 24 24"><path d="M4 19h6V6h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="4" cy="19" r="2" fill="currentColor"/><circle cx="20" cy="6" r="2" fill="currentColor"/></symbol>
  <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><path d="M3.5 7.5V18a1 1 0 0 0 1 1h15a1 1 0 0 0 1-1V9.5a1 1 0 0 0-1-1H12l-2-2.5H4.5a1 1 0 0 0-1 1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></symbol>
  <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5M9 4.5l3 2.5 3-2.5M9 19.5l3-2.5 3 2.5M4.2 11l2.8 1-.5-3.2M19.8 13l-2.8-1 .5 3.2M4.2 13l2.8-1-.5 3.2M19.8 11 17 12l.5-3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-door" viewBox="0 0 24 24"><path d="M6 3.5h9.5V20.5H6z M15.5 3.5 19 5v15l-3.5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="13" cy="12" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3.5V11M7.2 6.3a7 7 0 1 0 9.6 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.5 7 11a5.5 5.5 0 1 0 10 0z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
</svg>

<div id="app" class="app" data-mode="sim">
  <header class="topbar">
    <div class="brand" title="FrigoSIMU">
      <svg class="brand-mark"><use href="#i-snow"/></svg>
      <span class="brand-name">Frigo<b>SIMU</b></span>
    </div>
    <nav class="modes" aria-label="Modo">
      <button type="button" data-mode="sim" aria-pressed="true">Simulador</button>
      <button type="button" data-mode="diag" aria-pressed="false">Diagnosticar</button>
      <button type="button" data-mode="practice" aria-pressed="false">Practicar</button>
      <button type="button" data-mode="edit" aria-pressed="false">Editar esquema</button>
    </nav>
    <div class="tb-group tb-right" role="group" aria-label="Archivo">
      <label class="select-btn only-sim only-edit" title="Abrir un ejemplo o un esquema en blanco">
        <span class="sr-only">Ejemplos</span>
        <select id="sel-example"></select>
      </label>
      <button class="btn icon only-sim only-edit" id="btn-open" title="Abrir o importar un esquema: CADe SIMU (.cad), FrigoSIMU (.json), foto, PDF…"><svg><use href="#i-open"/></svg><span class="lbl">Importar</span></button>
      <button class="btn icon only-sim only-edit" id="btn-save" title="Guardar el esquema (.json)"><svg><use href="#i-save"/></svg><span class="lbl">Guardar</span></button>
      <button class="btn icon" id="btn-theme" title="Tema claro / oscuro"><svg><use href="#i-theme"/></svg></button>
      <input type="file" id="file-input" accept=".json,application/json" hidden>
    </div>
  </header>

  <!-- Barra de simulación y cuadro de mando -->
  <section class="simbar only-sim only-practice keep-card" aria-label="Control de la simulación">
    <div class="sb-group">
      <button class="btn icon" id="btn-pause" title="Pausa (espacio)"><svg><use href="#i-pause"/></svg></button>
      <div class="speeds" role="radiogroup" aria-label="Velocidad">
        <button type="button" data-speed="1" title="Tiempo real">×1</button>
        <button type="button" data-speed="10">×10</button>
        <button type="button" data-speed="30">×30</button>
        <button type="button" data-speed="120">×120</button>
        <button type="button" data-speed="600">×600</button>
      </div>
      <button class="btn small" id="btn-ff10" title="Adelantar 10 minutos"><svg><use href="#i-ffwd"/></svg>10 min</button>
      <button class="btn small" id="btn-ff60" title="Adelantar 1 hora"><svg><use href="#i-ffwd"/></svg>1 h</button>
      <button class="btn icon" id="btn-reset" title="Volver a empezar la simulación"><svg><use href="#i-reset"/></svg></button>
      <output class="sim-clock" id="sim-clock" title="Tiempo simulado">0:00:00</output>
    </div>
    <div class="sb-group quick" id="quick" aria-label="Cuadro de mando"></div>
  </section>

  <!-- Lecturas -->
  <section class="readings only-sim only-practice" id="readings" aria-label="Lecturas"></section>

  <main class="stage" id="stage">
    <aside class="palette only-edit" id="palette" aria-label="Componentes"></aside>
    <section class="pane pane-fridge only-sim only-practice" aria-label="Circuito frigorífico">
      <div class="pane-head">
        <h2>Circuito frigorífico</h2>
        <span class="pane-hint">Toca cualquier pieza para ver qué hace y cambiarla</span>
      </div>
      <div class="canvas-wrap fridge-wrap">
        <svg id="fridge-svg" class="fridge" role="img" aria-label="Circuito frigorífico animado"></svg>
      </div>
    </section>
    <div class="splitter only-sim only-practice" id="splitter" role="separator" aria-orientation="vertical" tabindex="0" title="Arrastra para repartir el espacio"></div>
    <section class="pane pane-elec only-sim only-practice only-edit" aria-label="Esquema eléctrico">
      <div class="pane-head">
        <h2>Esquema eléctrico</h2>
        <span class="pane-hint only-sim only-practice">Toca termostatos, presostatos, bobinas o motores para ver por qué están así</span>
        <span class="pane-spacer"></span>
        <span class="edit-tools only-edit">
          <button class="btn icon small" id="btn-undo" title="Deshacer (Ctrl+Z)"><svg><use href="#i-undo"/></svg></button>
          <button class="btn icon small" id="btn-redo" title="Rehacer (Ctrl+Y)"><svg><use href="#i-redo"/></svg></button>
          <button class="btn icon small tool" id="tool-select" data-tool="select" title="Seleccionar y mover (V)"><svg><use href="#i-cursor"/></svg></button>
          <button class="btn icon small tool" id="tool-wire" data-tool="wire" title="Dibujar cable (W)"><svg><use href="#i-wire"/></svg></button>
          <button class="btn icon small" id="btn-rotate" title="Girar 90° (R)"><svg><use href="#i-rotate"/></svg></button>
          <button class="btn icon small" id="btn-delete" title="Borrar (Supr)"><svg><use href="#i-trash"/></svg></button>
          <button class="btn icon small" id="btn-parts-mobile" title="Componentes"><svg><use href="#i-plus"/></svg></button>
        </span>
        <button class="btn icon small" id="btn-zoom-out" title="Alejar (−)"><svg><use href="#i-minus"/></svg></button>
        <button class="btn icon small" id="btn-zoom-in" title="Acercar (+)"><svg><use href="#i-plus"/></svg></button>
        <button class="btn icon small" id="btn-fit" title="Ver todo (F)"><svg><use href="#i-fit"/></svg></button>
      </div>
      <div class="canvas-wrap">
        <svg id="elec-svg" class="elec" role="img" aria-label="Esquema eléctrico"></svg>
        <div class="banner" id="elec-banner" hidden></div>
      </div>
      <div class="hint only-edit" id="elec-hint"></div>
    </section>
  </main>

  <!-- Qué está pasando / práctica -->
  <section class="story only-sim only-practice keep-card" aria-live="polite">
    <div class="story-now" id="story">
      <span class="story-ic" id="story-ic">i</span>
      <p id="story-text">La instalación está arrancando…</p>
      <button class="btn small" id="btn-story-log" type="button">Ver registro</button>
    </div>
    <div class="story-pred" id="story-pred" hidden></div>
    <div class="practice-box only-practice" id="practice"></div>
  </section>

  <!-- Página de diagnóstico -->
  <main class="diagpage only-diag" id="diagpage"></main>

  <section class="dock only-sim only-practice only-edit" id="dock">
    <div class="dock-resize" id="dock-resize" title="Arrastra para cambiar la altura"></div>
    <div class="tabs" role="tablist">
      <button role="tab" class="only-sim only-practice" data-tab="chart" aria-selected="true">Gráficas</button>
      <button role="tab" class="only-sim only-practice" data-tab="ph" aria-selected="false">Diagrama P-h</button>
      <button role="tab" class="only-sim only-practice" data-tab="log" aria-selected="false">Registro <span class="badge" id="log-badge" hidden></span></button>
      <button role="tab" class="only-sim" data-tab="room" aria-selected="false">Ajustes y averías</button>
      <button role="tab" class="only-edit" data-tab="props" aria-selected="false">Propiedades</button>
      <button role="tab" class="only-edit" data-tab="install" aria-selected="false">Instalación frigorífica</button>
      <span class="pane-spacer"></span>
      <button class="btn icon small" id="btn-dock" title="Plegar / desplegar el panel"><svg><use href="#i-chev"/></svg></button>
    </div>
    <div class="panels">
      <div class="panel chart-panel" data-panel="chart">
        <div class="chart-tools">
          <span>Ventana:</span>
          <button class="seg" data-win="900">15 min</button>
          <button class="seg on" data-win="1800">30 min</button>
          <button class="seg" data-win="3600">1 h</button>
          <button class="seg" data-win="14400">4 h</button>
          <span class="chart-legend"><i class="lg-run"></i>compresor en marcha <i class="lg-heat"></i>desescarche <i class="lg-door"></i>puerta abierta</span>
        </div>
        <canvas id="chart"></canvas>
      </div>
      <div class="panel chart-panel" data-panel="ph" hidden><canvas id="ph"></canvas></div>
      <div class="panel" data-panel="log" hidden>
        <div class="log-tools">
          <label><input type="checkbox" id="log-only-explain"> Solo explicaciones del circuito frigorífico</label>
          <button class="btn small" id="btn-log-clear">Borrar registro</button>
        </div>
        <ol class="log" id="log"></ol>
      </div>
      <div class="panel" data-panel="room" id="panel-room" hidden></div>
      <div class="panel" data-panel="props" id="panel-props" hidden></div>
      <div class="panel" data-panel="install" id="panel-install" hidden></div>
    </div>
  </section>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
