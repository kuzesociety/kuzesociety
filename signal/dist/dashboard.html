<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIGNAL">
<title>SIGNAL</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1318'/%3E%3Cpath d='M6 22 L12 14 L17 18 L26 8' stroke='%23f2a93b' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --ground:#f5f6f8; --surface:#ffffff; --raised:#eef1f5; --line:#dde2ea; --line2:#c9d0db;
  --ink:#10151c; --ink2:#4a5566; --ink3:#7a8596;
  --flare:#b86e00; --flare-soft:#fbead0; --flare-ink:#1a1204;
  --good:#138a5a; --good-soft:#dff3ea; --bad:#cc3340; --bad-soft:#fbe3e5; --warn:#9a7400; --warn-soft:#f7efcf; --info:#2f6fc0;
  --shadow:0 1px 2px rgba(16,21,28,.06),0 6px 20px rgba(16,21,28,.06);
  --r:12px; --r-sm:8px;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0f1318; --surface:#161b22; --raised:#1d2430; --line:#262e3b; --line2:#334052;
  --ink:#e7ebf2; --ink2:#a3adbd; --ink3:#6f7a8c;
  --flare:#f2a93b; --flare-soft:#3a2a12; --flare-ink:#1a1204;
  --good:#3ecf8e; --good-soft:#12301f; --bad:#ff6b6b; --bad-soft:#3a1519; --warn:#e8c547; --warn-soft:#332b0f; --info:#6aa8ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0f1318; --surface:#161b22; --raised:#1d2430; --line:#262e3b; --line2:#334052;
  --ink:#e7ebf2; --ink2:#a3adbd; --ink3:#6f7a8c;
  --flare:#f2a93b; --flare-soft:#3a2a12; --flare-ink:#1a1204;
  --good:#3ecf8e; --good-soft:#12301f; --bad:#ff6b6b; --bad-soft:#3a1519; --warn:#e8c547; --warn-soft:#332b0f; --info:#6aa8ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
a{color:var(--info);text-decoration:none}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .flare{color:var(--flare)}

/* shell */
.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top-row{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:750;letter-spacing:.14em;font-size:13px}
.brand svg{flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:650;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 22%,transparent)}
.dot.off{background:var(--bad)} .dot.mid{background:var(--warn)}
.spacer{flex:1}
.top-pnl{font-weight:700;font-size:15px;white-space:nowrap}
.main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:0;background:none;border-radius:10px;color:var(--ink3);font-size:11px;font-weight:600;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--flare)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--flare);outline-offset:2px}
@media (min-width:900px){
  .tabs{position:sticky;top:57px;bottom:auto;justify-content:flex-start;gap:4px;padding:6px 16px;border-top:0;border-bottom:1px solid var(--line);background:var(--ground)}
  .tab{flex:none;flex-direction:row;gap:8px;font-size:13px;padding:8px 14px;max-width:none}
  .tab svg{width:18px;height:18px}
  .tab[aria-current="page"]{background:var(--flare-soft)}
  .main{padding-bottom:40px}
}
.banner{max-width:1180px;width:calc(100% - 32px);margin:10px auto 0;padding:10px 14px;border-radius:var(--r-sm);font-weight:600;font-size:13px;display:flex;gap:10px;align-items:center}
.banner.sim{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.banner.bad{background:var(--bad-soft);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.savebar{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(640px,calc(100% - 24px));display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:var(--r);background:var(--surface);color:var(--ink);border:1px solid color-mix(in srgb,var(--flare) 55%,var(--line));box-shadow:var(--shadow);font-size:13px;font-weight:600}
@media (min-width:900px){.savebar{bottom:20px}}
.main:has(.savebar){padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.banner.info{background:color-mix(in srgb,var(--info) 12%,var(--surface));color:var(--info);border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}

/* building blocks */
.grid{display:grid;gap:12px}
.grid > *{min-width:0}
.main{overflow-x:clip}
@media (min-width:760px){.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h2,.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.section-title{display:flex;align-items:baseline;gap:10px;margin:18px 2px 10px}
.section-title h2{margin:0;font-size:17px;font-weight:720;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat .k{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;font-weight:650}
.stat .v{font-size:20px;font-weight:720;margin-top:2px}
.stat .s{font-size:12px;color:var(--ink2)}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:650;background:var(--raised);color:var(--ink2);white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.flare{background:var(--flare-soft);color:var(--flare)}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:650;cursor:pointer;min-height:40px}
.btn.primary{background:var(--flare);border-color:var(--flare);color:var(--flare-ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* score badge */
.score{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:17px;background:var(--raised);color:var(--ink2);position:relative}
.score small{position:absolute;bottom:3px;font-size:8.5px;font-weight:700;letter-spacing:.06em;opacity:.8}
.score.b1{background:var(--raised);color:var(--ink3)}
.score.b2{background:color-mix(in srgb,var(--flare) 16%,var(--surface));color:var(--ink)}
.score.b3{background:var(--flare);color:var(--flare-ink)}

/* radar list */
.list{display:flex;flex-direction:column;gap:8px}
.coin{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.coin:hover{border-color:var(--line2)}
.coin.held{border-color:var(--flare);box-shadow:inset 3px 0 0 var(--flare)}
.coin .body{flex:1;min-width:0}
.coin .title{display:flex;align-items:baseline;gap:6px;min-width:0}
.coin .sym{font-weight:760;font-size:15px}
.coin .name{color:var(--ink3);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coin .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;font-size:12.5px;color:var(--ink2)}
.coin .why{margin-top:6px;font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.coin .right{text-align:right;flex:none}
.bar{height:5px;border-radius:3px;background:var(--raised);overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;background:var(--flare);border-radius:3px}
.img{width:34px;height:34px;border-radius:9px;object-fit:cover;background:var(--raised);flex:none}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-weight:650}
.field .help{font-size:12.5px;color:var(--ink3)}
.field .ctrl{display:flex;align-items:center;gap:10px}
.inp{width:100%;max-width:140px;padding:9px 11px;border-radius:10px;border:1px solid var(--line2);background:var(--ground);font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--flare);height:32px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line2);transition:.15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.switch input:checked + span{background:var(--flare)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2px solid var(--flare);outline-offset:2px}
.bigswitch{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.bigswitch.on{border-color:var(--good);background:color-mix(in srgb,var(--good) 7%,var(--surface))}
details.more{border-top:1px solid var(--line);margin-top:6px}
details.more summary{cursor:pointer;padding:12px 0;font-weight:650;color:var(--ink2)}

/* tables */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}

/* contribution bars */
.contrib{display:grid;grid-template-columns:1fr 90px;gap:4px 10px;align-items:center;font-size:12.5px}
.cbar{position:relative;height:8px;background:var(--raised);border-radius:4px}
.cbar i{position:absolute;top:0;bottom:0;border-radius:4px}
.cbar .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:var(--ground);border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.35)}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:18px;max-height:86vh}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 12px}
.entrymoment{padding:10px 12px;border-radius:var(--r-sm);background:var(--raised);color:var(--ink2);font-size:13px}
.entrymoment.good{background:var(--good-soft);color:var(--good)}
.entrymoment.warn{background:var(--warn-soft);color:var(--warn)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-weight:650;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{padding:28px 16px;text-align:center;color:var(--ink3)}
.login{max-width:420px;margin:12vh auto;padding:0 16px}
.hist{display:flex;align-items:flex-end;gap:3px;height:56px}
.hist i{flex:1;background:var(--line2);border-radius:3px 3px 0 0;min-height:2px}
.hist i.hot{background:var(--flare)}
.spark{width:100%;height:64px;display:block}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--ink3)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.heat td{text-align:center;font-weight:650}
.note{font-size:12.5px;margin:10px 0 0}
.edge-meta{font-size:13px;color:var(--ink2);margin:10px 0 4px}
.edge{display:grid;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
.edge-rule{font-weight:700}
.strat{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.strat.active{box-shadow:inset 3px 0 0 var(--flare);padding-left:10px}
.inp.wide{max-width:none;flex:1;min-width:0}
.step .stepno{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--raised);font-weight:750;font-size:13px;flex:none}
.step.done{border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.step.done .stepno{background:var(--good-soft);color:var(--good)}
.step.hot{border-color:color-mix(in srgb,var(--info) 45%,var(--line))}
.step.hot .stepno{background:color-mix(in srgb,var(--info) 15%,var(--surface));color:var(--info)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.copyline{display:flex;gap:8px;align-items:center}
.copyline code{flex:1;min-width:0;overflow-wrap:anywhere;font-family:var(--mono);font-size:12px;background:var(--raised);padding:6px 8px;border-radius:6px}
.linkcode{font-size:20px;letter-spacing:.12em;color:var(--flare)}
.learn-head{font-size:14px;color:var(--ink);text-wrap:pretty}
.card h3.learn-sub{margin:14px 0 4px;font-size:12px}
.fresh{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.drivers{display:grid;gap:9px;margin-top:8px}
.driver{display:grid;grid-template-columns:16px 1fr auto;gap:2px 8px;align-items:center;font-size:13px}
.driver .arrow{font-weight:800;text-align:center}
.driver .bar,.driver .was{grid-column:2 / 4}
.driver .bar{margin-top:2px}
.driver .was{font-size:11.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
